[project]
name = "deepagents-runtime"
version = "0.1.0"
description = "DataFoundry Deep Agents runtime sidecar (AG-UI SSE contract)"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "DataFoundry" },
]

dependencies = [
    "deepagents>=0.3.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
deepagents-runtime = "deepagents_runtime.__main__:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
