name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_POSTINSTALL_BUILD: "1"

jobs:
  build-and-web-tests:
    name: Build and Web Tests
    if: github.repository == 'datagallery-lab/datafoundry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Web tests
        run: npm run test:web

      - name: Run TUI unit tests
        run: npm run test:tui

      - name: Build web and TUI
        run: npm run build

  native-deploy-smoke:
    name: Native Deploy Smoke
    if: github.repository == 'datagallery-lab/datafoundry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deployment unit tests
        run: npm run test:deploy

      - name: Run native deployment smoke
        run: npm run smoke:native-deploy

      - name: Upload redacted deployment logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-deploy-logs
          path: storage/logs/
          if-no-files-found: ignore

  docs:
    name: Docs
    if: github.repository == 'datagallery-lab/datafoundry'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Check documentation links and secrets
        run: npm run smoke:docs

      - name: Build documentation in strict mode
        run: npm run docs:build
