AGENT_CONFIG:
  name: "电商分析专家"
  type: "react"
  backend: "langgraph"
  enable_human_feedback: true  # 启用 HITL 功能
  debug: true

SUITE:
  include:
    - ecommerce_suite

MODEL:
  chat_model:
    model_type: "chat"
    provider: "bailian"
    params:
      model: "deepseek-v4-flash"
      temperature: 0.7

SCENARIO:
  chat:
    input: data engineering prompt
    task: run a tool chain and summarize
    instructions: 先调用 natural_language_to_sql 获取所需数据，再按需生成图表或报告。
      After you generate the report, you can end the process.
    output_format: done

DATASOURCE:
  database_address: $env{DATASOURCE_DATABASE_ADDRESS}
  database_table_name: "Ecommerce"

PRE_WORKFLOW: []
