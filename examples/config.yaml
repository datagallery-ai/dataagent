schema_version: 4
dataagent:
  model: primary
  limits:
    timeout_seconds: 180
    model_calls_per_agent: 128
    tool_calls_per_agent: 128
  loop_detection:
    enabled: true
    ignored_tools: []
  input_workspaces: []
  entry: null
  hooks:
    before_agent:
    - entrypoint: hooks/check_input.py:handle
      params:
        max_chars: 4000
    after_agent: []
    before_model: []
    after_model: []
    before_tool:
    - matcher: common__summarize_numbers
      entrypoint: hooks/check_tool.py:handle
      params:
        blocked_tools: []
    after_tool: []
  output_root: null
models:
  primary:
    provider: openai
    name: $env{LLM_MODEL}
    base_url: $env{LLM_BASE_URL}
    api_key: $env{LLM_API_KEY}
    max_retries: 2
    temperature: null
    max_tokens: null
    extra_body: {}
plugins:
  enabled:
  - common
  paths: []
  config: {}
semantic: null
a2a:
  card:
    name: DataAgent
    description: 与 DataAgent 对话并获取回答
  remote_agents: []
