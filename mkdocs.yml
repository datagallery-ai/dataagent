site_name: DataAgent
site_description: Governed data-agent workbench for enterprise data tasks.
site_url: https://datagallery-lab.github.io/datafoundry/
repo_name: datagallery-lab/datafoundry
repo_url: https://github.com/datagallery-lab/datafoundry
edit_uri: edit/main/docs/

exclude_docs: |
  README.md
  assets/readme/tui-demo.mp4
  en/README.md
  zh/README.md

not_in_nav: |
  /index.md
  development/*.md
  en/reference/supported-datasources.md
  en/guides/compatibility/
  en/guides/integrate/extensions/
  zh/*.md
  zh/**/*.md

hooks:
  - scripts/dev/docs_hooks.py

theme:
  name: material
  icon:
    logo: material/database
  language: en
  palette:
    - scheme: default
      primary: white
      accent: blue
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest

extra_css:
  - assets/mkdocs/extra.css

extra_javascript:
  - assets/mkdocs/language-switcher.js

extra:
  source_tree_url: !ENV [DATAAGENT_DOCS_SOURCE_TREE_URL, "https://gitcode.com/datagallery/dataagent/blob/main"]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datagallery-lab/datafoundry
  alternate:
    - name: English
      link: en/
      lang: en
    - name: 简体中文
      link: zh/
      lang: zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Use and Integration:
      - en/index.md
      - Quick start: en/quick-start.md
      - Deploy and configure:
          - Source deployment: en/guides/deploy-source.md
          - Package deployment: en/guides/deploy-packages.md
          - Custom mirrors: en/guides/deploy-mirrors.md
          - Configuration: en/reference/configuration-api.md
          - Advanced configuration: en/guides/configuration.md
          - Troubleshooting: en/guides/troubleshooting.md
      - Work with DataAgent:
          - Web workbench: en/guides/web.md
          - TUI: en/guides/tui.md
          - Data inputs: en/guides/inputs.md
          - Sessions and outputs: en/guides/sessions-and-outputs.md
      - Integrate and extend:
          - Python SDK and extensions: en/guides/integrate/index.md
          - AG-UI integration: en/reference/agent-runtime.md
          - Python SDK: en/guides/integrate/sdk.md
          - Extensions: en/guides/integrate/extensions/overview.md
          - Plugins: en/guides/integrate/extensions/plugins.md
          - MCP integration: en/guides/integrate/extensions/mcp.md
      - Reference:
          - REST API: en/reference/rest-api.md
          - AG-UI protocol: en/reference/events.md
          - A2A: en/reference/a2a.md
          - Configuration fields: en/reference/configuration.md
          - CLI and environment: en/reference/cli-and-environment.md
          - Python API: en/reference/python-api.md
          - Extension schema: en/reference/extension-schema.md
          - MCP configuration: en/reference/mcp-configuration.md
      - Concepts:
          - Product overview: en/concepts/overview.md
          - Capabilities: en/concepts/capabilities.md
          - Architecture overview: en/concepts/architecture.md
          - Security: en/concepts/security.md
      - Community:
          - en/community/index.md
          - Contact us: en/community/contact-us.md
          - Contributing: en/community/contributing.md
          - Scenario cases: en/community/scenario-cases.md
          - Collaboration policy: en/community/collaboration-policy.md
  - Developer Docs:
      - development/index.md
      - Development setup: development/setup.md
      - Testing: development/testing.md
      - Architecture:
          - Architecture overview: development/architecture/overview.md
          - Bootstrap: development/architecture/bootstrap.md
          - Execution: development/architecture/execution.md
          - Context management: development/architecture/context-management.md
          - Extension lifecycle: development/architecture/extension-lifecycle.md
          - Home layout: development/architecture/home-layout.md
          - State and storage: development/architecture/state-and-storage.md
          - Observability: development/architecture/observability.md
          - Security boundaries: development/architecture/security-boundaries.md
          - HTTP implementation: development/reference/rest-api.md
      - Core maintenance: development/core-maintenance.md
      - Build and release: development/release.md
      - Legacy migration: development/archive/main-legacy-migration.md
