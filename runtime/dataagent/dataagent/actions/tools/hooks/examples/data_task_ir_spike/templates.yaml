      global_rules:
        - join 条件必须逐项给出左右字段和操作符；不得只写“关联用户维表”。
        - 基数是数据契约而不是优化提示；证据未说明时填 null 并写入 unresolved。
        - 时间有效关联必须明确起止边界、开放结束值语义和事实时间字段。
        - join_type 等子字段发生无优先级冲突时，只将受影响子字段置为 null；不得因为基础证据先出现就选择它。
        - 只有工具证据明确给出事实源与维度源的关联关系时才填写本字段；任务不涉及维度关联时 relations 必须为空数组，禁止按星型模型常识发明关联。
      subfields:
        relations: 每项填写事实源、维度源、join_type、conditions、cardinality、unmatched_fact、temporal_validity。
        conditions.null_matches: 明确双方 null 是否匹配。
        temporal_validity: 非时间有效关联填 null。
      completion_conditions:
        - 每个关联均有完整谓词；关联类型、基数和未匹配行为明确。
      common_errors:
        - 根据常见星型模型猜测 many_to_one。
        - 忽略有效期的开闭边界。
        - 没有维度关联证据时仍根据通用建模知识补出 join。
    few_shots:
      - input: orders left join dim_user on orders.user_id = dim_user.user_id，null 不匹配，many_to_one；未匹配事实保留且维度列为空；非时间有效关联。
        output:
          field_id: dimension_relations
          value:
            relations:
              - fact_source_ref: orders
                dimension_source_ref: dim_user
                join_type: left
                conditions:
                  - fact_field: user_id
                    operator: eq
                    dimension_field: user_id
                    null_matches: false
                cardinality: many_to_one
                unmatched_fact: retain_with_nulls
                temporal_validity: null
          unresolved: []
          rationale: 按证据填写 join_type/关联条件（null 不匹配）/基数/未匹配事实保留且维度列空。
      - input: orders 关联 dim_user，只给了 user_id 相等。
        output:
          field_id: dimension_relations
          value:
            relations:
              - fact_source_ref: orders
                dimension_source_ref: dim_user
                join_type: null
                conditions:
                  - fact_field: user_id
                    operator: eq
                    dimension_field: user_id
                    null_matches: null
                cardinality: null
                unmatched_fact: null
                temporal_validity: null
          unresolved:
            - 关联类型、空值匹配、基数和未匹配事实行为未说明
          question: 现有信息说明了关联字段，但没有说清 join 类型、空值匹配、基数及未匹配事实处理；请补充这些关联口径。
          rationale: 只有 user_id 相等有证据；其余子字段无证据保持 null 并记入 unresolved。
      - input: 任务只涉及单张事实源表，没有维度表和关联关系。
        output:
          field_id: dimension_relations
          value:
            relations: []
          unresolved: []
          rationale: 任务只涉及单张事实源表，无维度表与关联关系，relations 为空。
    writable_template:
      field_id: dimension_relations
      value:
        relations:
          - fact_source_ref: null
            dimension_source_ref: null
            join_type: null
            conditions:
              - fact_field: null
                operator: null
                dimension_field: null
                null_matches: null
            cardinality: null
            unmatched_fact: null
            temporal_validity:
              fact_time_field: null
              valid_from_field: null
              valid_to_field: null
              start_inclusive: null
              end_inclusive: null
              open_end_allowed: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [relations]
      properties:
        relations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [fact_source_ref, dimension_source_ref, join_type, conditions, cardinality, unmatched_fact, temporal_validity]
            properties:
              fact_source_ref: {type: string, minLength: 1}
              dimension_source_ref: {type: string, minLength: 1}
              join_type: {enum: [left, inner, right, full, null]}
              conditions:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [fact_field, operator, dimension_field, null_matches]
                  properties:
                    fact_field: {type: string, minLength: 1}
                    operator: {enum: [eq, ne, gt, gte, lt, lte]}
                    dimension_field: {type: string, minLength: 1}
                    null_matches: {type: [boolean, "null"]}
              cardinality: {enum: [one_to_one, one_to_many, many_to_one, many_to_many, null]}
              unmatched_fact: {enum: [reject, retain_with_nulls, conflict, null]}
              temporal_validity:
                oneOf:
                  - {type: "null"}
                  - type: object
                    additionalProperties: false
                    required: [fact_time_field, valid_from_field, valid_to_field, start_inclusive, end_inclusive, open_end_allowed]
                    properties:
                      fact_time_field: {type: string, minLength: 1}
                      valid_from_field: {type: string, minLength: 1}
                      valid_to_field: {type: string, minLength: 1}
                      start_inclusive: {type: boolean}
                      end_inclusive: {type: boolean}
                      open_end_allowed: {type: boolean}

  - field_id: time_window
    title: 时间窗口
    purpose: 定义哪些事实时间点属于输入集合，尤其明确锚点、周期类型和区间边界。
    optional: true
    not_applicable_value:
      time_field: null
      anchor: {field: null, value: null}
      range: {type: null, direction: null, number: null, unit: null, include_anchor_period: null}
      boundary: {start_inclusive: null, end_inclusive: null}
      null_time_semantics: null
    field_instructions:
      global_rules:
        - 必须区分 calendar_periods 与 duration；“过去 7 天”若证据未说明是哪一种，不能自行选择。
        - include_anchor_period 与 start/end_inclusive 都必须明确；不得用“包含最近七天”等语言代替边界。
        - statistic_period 的空值规则或其他字段口径不能自动复制到时间窗口；每个窗口子字段必须有直接证据。
        - 窗口子字段发生无优先级冲突时，将该子字段置为 null 并写入 unresolved，不得保留先出现的值。
      subfields:
        time_field: 判定记录进入窗口的事实时间字段。
        anchor: 有直接证据时填写锚点字段或固定锚点值；没有时保持 null。
        range: 填 type、direction、number、unit、include_anchor_period。
        boundary: 明确起点和终点是否包含。
        null_time_semantics: 时间为空时排除、包含还是冲突。
      completion_conditions:
        - 时间字段、范围方向、数量和单位均明确；其他子字段有证据时一并填写。
      common_errors:
        - 默认认为过去 7 天包含今天。
        - 把统计周期的日粒度当成窗口定义。
    few_shots:
      - input: event_time 取过去 7 个完整自然日，不含今天；区间左闭右开；空时间排除。
        output:
          field_id: time_window
          value:
            time_field: event_time
            anchor:
              field: null
              value: null
            range:
              type: calendar_periods
              direction: past
              number: 7
              unit: day
              include_anchor_period: false
            boundary:
              start_inclusive: true
              end_inclusive: false
            null_time_semantics: exclude_record
          unresolved: []
          rationale: 按证据填写窗口范围（过去 7 个完整自然日、不含今天）、左闭右开边界与空时间排除。
      - input: 用户说“过去 7 天”，其余信息没有说明。
        output:
          field_id: time_window
          value:
            time_field: null
            anchor:
              field: null
              value: null
            range:
              type: null
              direction: past
              number: 7
              unit: day
              include_anchor_period: null
            boundary:
              start_inclusive: null
              end_inclusive: null
            null_time_semantics: null
          unresolved:
            - 时间字段、自然日或时长、是否包含锚点周期、开闭边界和空时间行为未说明
          question: 用户要求过去 7 天，但用户和证据没有说清时间字段、周期类型、边界及空时间处理；请补充这些窗口口径。
          rationale: 只有"7 天"有证据；时间字段、边界与空时间行为均未说明，保持 null 并记入 unresolved。
      - input: 窗口直接证据说 event_time 取过去 7 个完整自然日；工具 A 说包含今天，工具 B 说不包含今天，无优先级；其他窗口子字段均明确。
        output:
          field_id: time_window
          value:
            time_field: event_time
            anchor:
              field: null
              value: null
            range:
              type: calendar_periods
              direction: past
              number: 7
              unit: day
              include_anchor_period: null
            boundary:
              start_inclusive: true
              end_inclusive: false
            null_time_semantics: exclude_record
          unresolved:
            - 窗口是否包含今天存在无优先级冲突
          question: 工具 A 和工具 B 都说明了窗口是否包含今天，但结论相反且无优先级；请确认是否包含今天。
          rationale: 按直接证据填写范围与边界；是否包含今天在工具 A/B 间冲突且无优先级，保持 null 并记入 unresolved。
    writable_template:
      field_id: time_window
      value:
        time_field: null
        anchor:
          field: null
          value: null
        range:
          type: null
          direction: null
          number: null
          unit: null
          include_anchor_period: null
        boundary:
          start_inclusive: null
          end_inclusive: null
        null_time_semantics: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [time_field, anchor, range, boundary, null_time_semantics]
      properties:
        time_field: {type: [string, "null"]}
        anchor:
          type: object
          additionalProperties: false
          required: [field, value]
          properties:
            field: {type: [string, "null"]}
            value: {type: [string, "null"]}
        range:
          type: object
          additionalProperties: false
          required: [type, direction, number, unit, include_anchor_period]
          properties:
            type: {enum: [calendar_periods, duration, null]}
            direction: {enum: [past, future, null]}
            number: {type: [integer, "null"], minimum: 1}
            unit: {enum: [minute, hour, day, week, month, quarter, year, null]}
            include_anchor_period: {type: [boolean, "null"]}
        boundary:
          type: object
          additionalProperties: false
          required: [start_inclusive, end_inclusive]
          properties:
            start_inclusive: {type: [boolean, "null"]}
            end_inclusive: {type: [boolean, "null"]}
        null_time_semantics: {enum: [exclude_record, include_record, conflict, null]}

  - field_id: window_partitioning
    title: 窗口分区键
    purpose: 定义窗口函数（如ROW_NUMBER()、RANK()、LAG()等）执行时的PARTITION BY分组键，与最终序列分区键（final_sequence_partitioning）和特征主键（feature_key）是不同概念。
    optional: true
    not_applicable_value:
      partition_fields: []
      null_equality: null
    field_instructions:
      global_rules:
        - window_partitioning 定义的是窗口函数执行时的分组范围，不是最终输出的分组
        - 窗口分区键应细于或等于最终序列分区键；当二者不同时，窗口分区会产生中间序列
        - 只有在SQL中使用了窗口函数（ROW_NUMBER、RANK、SUM/AVG OVER等）时才需要填写此字段
        - 如果最终输出是直接聚合结果（GROUP BY without窗口函数），此字段可能不适用
        - 涉及排序/排名/TopN 的任务（用户要求“排名”“前N”“每个X中最高/最多”“保留每个X前N条”等，或最终输出含 rank/row_number 字段）必须明确填写此字段：partition_fields = 排序范围“每个X”中的 X（通常等于聚合分组键），禁止留空让 SQL Agent 自行推断 PARTITION BY
        - 排序范围为“每个X”，但 X 在最终输出中未体现时，partition_fields 仍须按 X 填写，不得省略
      subfields:
        partition_fields: 窗口函数PARTITION BY的字段列表
        null_equality: 空值在窗口分区等价关系中的处理
      completion_conditions:
        - 窗口分区键字段与窗口函数中实际使用的PARTITION BY字段一致
        - 任务涉及排序/排名/TopN 时，partition_fields 已明确填写排序范围字段（不可留空）
      common_errors:
        - 把最终序列分区键误认为是窗口分区键
        - 在没有窗口函数的场景下错误填写此字段
        - 排序/TopN 任务漏填或留空 window_partitioning，导致 SQL Agent 自行猜测 PARTITION BY 范围（如漏掉按 list_id/device 分区，直接全表排序）
    few_shots:
      - input: 用户要求按app_id分组计算每日使用次数排名，使用ROW_NUMBER() OVER(PARTITION BY app_id ORDER BY usage_cnt DESC)
        output:
          field_id: window_partitioning
          value:
            partition_fields: [app_id]
            null_equality: reject_record
          unresolved: []
          rationale: 窗口函数按 app_id 分区，故分区字段为 app_id；空值拒绝。
      - input: 用户要求统计每个用户的总消费金额，没有使用任何窗口函数
        output:
          field_id: window_partitioning
          value:
            partition_fields: []
            null_equality: null
          unresolved: []
          rationale: 统计总消费金额不使用窗口函数，partition_fields 为空。
      - input: 用户要求计算每个设备每天的应用使用次数序列，使用窗口函数先按imei分区排序
        output:
          field_id: window_partitioning
          value:
            partition_fields: [imei]
            null_equality: reject_record
          unresolved: []
          rationale: 窗口函数按 imei 分区排序，分区字段为 imei。
      - input: 用户要求按imei、tail、app_type做聚合，但排序时每个imei内部再按使用次数排序
        output:
          field_id: window_partitioning
          value:
            partition_fields: [imei]
            null_equality: reject_record
          unresolved: []
          rationale: 窗口函数只按 imei 分区，imei/tail/app_type 是聚合键而非窗口分区键，partition_fields 只取 imei。
    writable_template:
      field_id: window_partitioning
      value:
        partition_fields: []
        null_equality: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [partition_fields, null_equality]
      properties:
        partition_fields: {type: array, items: {type: string, minLength: 1}}
        null_equality: {enum: [nulls_equal, nulls_distinct, reject_record, conflict, null]}

  - field_id: final_sequence_partitioning
    title: 最终序列分区
    purpose: 定义哪些最终记录属于同一个逻辑序列；这不是存储分区或 SQL 性能提示。
    optional: true
    not_applicable_value:
      partition_fields: []
      null_equality: null
    field_instructions:
      global_rules:
        - partition_fields 定义逻辑序列的等价类，不得填写表分区、文件分桶等物理信息。
        - 多字段分区必须全部列出，并明确空值等价关系。
      subfields:
        partition_fields: 构成同一逻辑序列的全部字段。
        null_equality: 空值在分区等价关系中的处理。
      completion_conditions:
        - 序列存在时，字段与空值等价关系均明确。
      common_errors:
        - 把 feature_key 无证据地复制成分区键。
        - 把 SQL PARTITION BY 语法当作语义定义。
    few_shots:
      - input: 每个 user_id、device_id 形成一条序列；任一为空则拒绝记录。
        output:
          field_id: final_sequence_partitioning
          value:
            partition_fields: [user_id, device_id]
            null_equality: reject_record
          unresolved: []
          rationale: 按证据填写分区字段 user_id/device_id，任一为空拒绝记录。
      - input: 没有序列概念或分区要求。
        output:
          field_id: final_sequence_partitioning
          value:
            partition_fields: []
            null_equality: null
          unresolved: []
          rationale: 无序列概念或分区要求，分区字段为空。
    writable_template:
      field_id: final_sequence_partitioning
      value:
        partition_fields: []
        null_equality: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [partition_fields, null_equality]
      properties:
        partition_fields: {type: array, items: {type: string, minLength: 1}}
        null_equality: {enum: [nulls_equal, nulls_distinct, reject_record, conflict, null]}

  - field_id: final_sequence_ordering
    title: 最终序列排序依据
    purpose: 定义每个逻辑序列内部的词典序全序关系。
    optional: true
    not_applicable_value:
      criteria: []
      tie_behavior: null
    field_instructions:
      global_rules:
        - criteria 按比较优先级排列；每项必须有字段、方向、类型和空值排序。
        - 如果所有条件相同仍不能形成全序，必须用 tie_behavior 明确冲突、等价或保留全部。
        - 已确认排序字段但方向、类型或空值位置未确认时，仍保留该字段项并将未知子字段填 null；不得删除整项。
      subfields:
        criteria: 按优先级填写 field_ref、direction、value_type、null_rank。
        tie_behavior: 所有排序键相同时的行为。
      completion_conditions:
        - 需要确定顺序时 criteria 非空，且平局行为明确。
      common_errors:
        - 只写“按时间排序”而没有升降序和空值位置。
        - 把用于去重的选择规则自动当作展示顺序。
    few_shots:
      - input: 序列先按 event_time 升序，空值拒绝；同时间按 event_id 升序，空值最高；仍相同视为等价。
        output:
          field_id: final_sequence_ordering
          value:
            criteria:
              - field_ref: event_time
                direction: ascending
                value_type: datetime
                null_rank: reject_record
              - field_ref: event_id
                direction: ascending
                value_type: string
                null_rank: highest
            tie_behavior: records_are_equivalent
          unresolved: []
          rationale: 按证据填写两级排序标准（event_time 升序空值拒绝、event_id 升序空值最高）与平局等价行为。
      - input: 只说“按发生时间排”。
        output:
          field_id: final_sequence_ordering
          value:
            criteria:
              - field_ref: event_time
                direction: null
                value_type: null
                null_rank: null
            tie_behavior: null
          unresolved:
            - event_time 的方向、类型、空值排序和平局行为未说明
          question: 现有信息要求按 event_time 排序，但没有说清方向、类型、空值位置及平局行为；请补充这些排序口径。
          rationale: 只有排序字段有证据；方向、类型、空值排序与平局行为未说明，保持 null 并记入 unresolved。
    writable_template:
      field_id: final_sequence_ordering
      value:
        criteria:
          - field_ref: null
            direction: null
            value_type: null
            null_rank: null
        tie_behavior: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [criteria, tie_behavior]
      properties:
        criteria:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field_ref, direction, value_type, null_rank]
            properties:
              field_ref: {type: string, minLength: 1}
              direction: {enum: [ascending, descending, null]}
              value_type: {enum: [string, number, date, datetime, boolean, null]}
              null_rank: {enum: [lowest, highest, reject_record, conflict, null]}
        tie_behavior: {enum: [conflict, retain_all, records_are_equivalent, null]}

  - field_id: final_sequence_deduplication
    title: 最终序列去重规则
    purpose: 定义最终序列中按特征主键识别重复后，是否以及如何得到唯一记录。
    optional: true
    not_applicable_value:
      identity_ref: null
      custom_identity_fields: []
      on_duplicate: null
      record_selection:
        criteria: []
        if_all_criteria_equal: null
    field_instructions:
      global_rules:
        - identity_ref 优先引用 feature_key，不重复抄写主键；只有证据明确使用另一组身份字段时才用 custom。
        - on_duplicate=choose_one 时必须填写完整 record_selection；retain_all 或 conflict 时 criteria 应为空。
        - 禁止用“最新、优先”等词代替明确选择函数。
        - on_duplicate 发生无优先级冲突时，on_duplicate 填 null，record_selection 清空并将平局行为填 null；不得选择某一行为。
        - feature_key 内部由哪些字段构成即使发生冲突，也不改变 identity_ref=feature_key 这个引用；不得把其他 Field Unit 的冲突传播到本字段。
        - 用户或证据未明确提到“最终输出需要去重/唯一化/重复记录处理”时，identity_ref 必须为 null、on_duplicate 必须为 null、record_selection.criteria 必须为空数组；禁止按通用建模知识补出最终序列去重。
        - 禁止把“排名前N”“取得分最大”“按得分排序”等 TopN/排序语义写成 on_duplicate=choose_one 或 record_selection；这些由 final_sequence_ordering 和 final_sequence_truncation 承载。
        - 任务同时存在 TopN 截断（final_sequence_truncation 非空）且无重复记录证据时，identity_ref 必须为 null：按 feature_key 判重后 choose_one 会使每个序列只剩一条，与“保留前N”直接冲突。
      subfields:
        identity_ref: feature_key 或 custom。
        custom_identity_fields: identity_ref=custom 时填写，否则为空数组。
        on_duplicate: choose_one、retain_all 或 conflict。
        record_selection: 结构与事实去重的选择函数一致。
      completion_conditions:
        - 重复身份和重复处理行为均明确；choose_one 时选择函数无未决平局。
      common_errors:
        - 再次复制 feature_key 字段造成口径漂移。
        - 把序列排序依据直接当作去重选择函数。
        - 把 TopN 截断或排序规则误写成最终序列去重（identity_ref=feature_key + choose_one 时每个序列只剩一条，与“保留前N”矛盾）。
    few_shots:
      - input: 最终序列按 feature_key 判重；重复时取 score 最大，空值最低；仍相同则冲突。
        output:
          field_id: final_sequence_deduplication
          value:
            identity_ref: feature_key
            custom_identity_fields: []
            on_duplicate: choose_one
            record_selection:
              criteria:
                - field_ref: score
                  choose: greatest
                  value_type: number
                  null_rank: lowest
              if_all_criteria_equal: conflict
          unresolved: []
          rationale: 按证据填写 identity_ref=feature_key 与选择标准（score 最大、空值最低、平局冲突）。
      - input: 最终结果不去重，重复记录全部保留。
        output:
          field_id: final_sequence_deduplication
          value:
            identity_ref: feature_key
            custom_identity_fields: []
            on_duplicate: retain_all
            record_selection:
              criteria: []
              if_all_criteria_equal: retain_all
          unresolved: []
          rationale: 用户明确不去重、重复全部保留，对应 retain_all。
      - input: 最终按 feature_key 判重，重复时取 score 最大且平局冲突；另一个 Field Unit 中，feature_key 的具体字段候选发生冲突。
        output:
          field_id: final_sequence_deduplication
          value:
            identity_ref: feature_key
            custom_identity_fields: []
            on_duplicate: choose_one
            record_selection:
              criteria:
                - field_ref: score
                  choose: greatest
                  value_type: number
                  null_rank: lowest
              if_all_criteria_equal: conflict
          unresolved: []
          rationale: 本字段的身份引用与选择标准有证据；feature_key 字段候选冲突属其他 Field Unit，不跨字段记录。
    writable_template:
      field_id: final_sequence_deduplication
      value:
        identity_ref: null
        custom_identity_fields: []
        on_duplicate: null
        record_selection:
          criteria:
            - field_ref: null
              choose: null
              value_type: null
              null_rank: null
          if_all_criteria_equal: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [identity_ref, custom_identity_fields, on_duplicate, record_selection]
      properties:
        identity_ref: {enum: [feature_key, custom, null]}
        custom_identity_fields: {type: array, items: {type: string, minLength: 1}}
        on_duplicate: {enum: [choose_one, retain_all, conflict, null]}
        record_selection:
          type: object
          additionalProperties: false
          required: [criteria, if_all_criteria_equal]
          properties:
            criteria:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field_ref, choose, value_type, null_rank]
                properties:
                  field_ref: {type: string, minLength: 1}
                  choose: {enum: [greatest, least, null]}
                  value_type: {enum: [string, number, date, datetime, boolean, null]}
                  null_rank: {enum: [lowest, highest, reject_record, conflict, null]}
            if_all_criteria_equal: {enum: [conflict, retain_all, records_are_equivalent, null]}

  - field_id: final_sequence_truncation
    title: 最终序列截断（TopN）
    purpose: 定义每个逻辑序列内最多保留的记录数上限（如“排名前10”），以及达到上限且排序键并列时的处理方式。
    optional: true
    not_applicable_value:
      limit_per_partition: null
      tie_behavior: null
    field_instructions:
      global_rules:
        - limit_per_partition 表示每个逻辑序列内最多保留的记录数；与 final_sequence_ordering 配合，先排序后截断。
        - 只有用户明确给出数量上限（如“前10”“Top 10”“取10条”）时才填写；用户只要求排序时 limit_per_partition 必须为 null。
        - 截断发生在最终排序之后、去重与输出之前；不得把截断写成过滤条件、去重规则或聚合。
      subfields:
        limit_per_partition: 每个逻辑序列内保留的记录数上限，正整数。
        tie_behavior: 排序键并列且达到上限时，retain_all 表示保留全部并列记录，truncate_exact 表示仍只取上限条数。
      completion_conditions:
        - 用户明确给出截断条数时 limit_per_partition 已填写；并列行为有证据时 tie_behavior 已明确。
      common_errors:
        - 把“取排名前10”误写成 fact_filters 谓词或去重规则。
        - 用户只说排序时自行补出截断条数。
    few_shots:
      - input: 每个应用ID保留运营标签得分排名前10的标签记录。
        output:
          field_id: final_sequence_truncation
          value:
            limit_per_partition: 10
            tie_behavior: null
          unresolved: []
          rationale: 按证据填写每分区保留前 10 条，未说明并列行为故 tie_behavior 为 null。
      - input: 每个设备按得分排序后取前5条，得分并列时全部保留。
        output:
          field_id: final_sequence_truncation
          value:
            limit_per_partition: 5
            tie_behavior: retain_all
          unresolved: []
          rationale: 按证据填写每分区保留前 5 条，得分并列时全部保留。
      - input: 用户只要求按事件时间排序，没有提出条数上限。
        output:
          field_id: final_sequence_truncation
          value:
            limit_per_partition: null
            tie_behavior: null
          unresolved: []
          rationale: 只要求按事件时间排序，没有条数上限证据，limit_per_partition 为 null。
    writable_template:
      field_id: final_sequence_truncation
      value:
        limit_per_partition: null
        tie_behavior: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [limit_per_partition, tie_behavior]
      properties:
        limit_per_partition: {type: [integer, "null"], minimum: 1}
        tie_behavior: {enum: [retain_all, truncate_exact, null]}

  - field_id: output_fields
    title: 输出字段定义
    purpose: 定义最终输出中除特征主键外的业务/指标列、语义级计算口径与聚合粒度；与 feature_key 共同构成完整输出列清单。
    field_instructions:
      global_rules:
        - 每个输出字段必须有明确的数据来源或业务语义（字段引用、指标名或简要口径说明）
        - 聚合字段必须说明聚合意图（如计数/求和/去重计数）和聚合粒度；精细计数语义优先写入 aggregation_metrics，不在本字段展开
        - 用户明确要求的输出字段不得遗漏
        - expression 只记录**语义级**计算口径说明（聚合类型 + 对象 + 必要限定），用于帮助下游理解“算什么”；禁止追求可执行 SQL/UDF 语法，禁止编造未证实的函数名、方言写法、参数顺序或嵌套逻辑
        - expression 允许的粒度示例：“近30天下载次数（行计数）”“付费金额求和”“活跃天数（按自然日去重计数）”“下载量最高的类目”；不要求写成 count(...)/sum(...)/date_format(...)/arg_max(...) 等具体表达式
        - 证据未给出可确认的计算细节时，expression 用简短语义即可，细节留空或写入 unresolved；不得为“填满字段”而 invent 具体公式
        - 无计算、直接透传的字段：expression 填 null，仅填 source；有计算意图时优先保证 description / expression 语义清楚，source 可填主要参与字段或 null
        - 特征主键列由 feature_key 单独记录；本字段不要为“保证能输出主键”而重复抄写 feature_key.components（除非用户明确要求把主键再列一次业务别名列）
        - 多维交叉展开：当输出同时沿多个独立维度变化（如多个时间窗口/统计周期 × 多个指标/特征名 × 多个对象类型等），必须按笛卡尔积为每个组合各建一条独立 fields 项；不得把多个组合压成一个字段、只列维度名而不展开、或只填“代表项”
        - 展开后的 fields 条数必须等于各维度基数之积（例如 3 个时间周期 × 3 个特征 = 9 条）；任一组合缺失、合并或改名导致数量不对时，必须写入 unresolved，禁止自行少填或多填
        - 每个展开项的 field_name / description（及必要时 expression）必须能唯一标识其所属维度组合（如 7d_download_cnt 与 30d_download_cnt 分列），禁止共用同一 field_name
        - aggregation_grain 记录该输出列自身的聚合分组键（GROUP BY 粒度），与 feature_key / 任务级 aggregation_precedence.aggregation_key 可能不同；聚合类字段（count/sum/avg/max/min 等）必须填写非空数组，非聚合直出字段填 null
        - 同一任务中不同输出特征可以有不同聚合粒度；必须逐字段写明各自的 aggregation_grain，禁止用单一全局粒度覆盖全部特征，禁止因多数特征同粒度而省略少数不同粒度特征的说明
        - 若某特征按主键聚合、另一特征按主键+类目/会话等更细或更粗粒度聚合，二者的 aggregation_grain 必须分别列出完整分组键，不得互相推断或省略
        - aggregation_grain 应与对应 aggregation_metrics.*.group_by（及多阶段时 aggregation_stages[].group_by）一致；冲突时保持 null 并写入 unresolved，禁止任选一方
      subfields:
        fields: 按输出顺序列出每个字段的 field_name、source、expression（语义级口径，非必可执行 SQL）、output_type、description、aggregation_grain；多维交叉时按笛卡尔积展开后的顺序填写
      completion_conditions:
        - 所有用户要求的输出字段均被覆盖
        - 多维交叉场景下 fields 条数等于各维度基数之积，且每个组合均可被 field_name/description 唯一识别
        - 每个字段有明确来源或语义级口径（source / expression / description 至少一项可定位业务含义）
        - 有计算意图的字段已用 description 或 expression 说明“算什么”；不要求写出可执行 SQL
        - 每个聚合类输出字段均已填写非空 aggregation_grain；存在多种聚合粒度时各字段粒度均可区分
      common_errors:
        - 遗漏用户要求的输出字段
        - 字段来源与业务含义都不清楚
        - 把未证实的 SQL/UDF 细节写入 expression（错误函数名、错误参数、错误方言），导致下游照抄出错
        - 为凑“具体表达式” invent 公式，或把 aggregation_metrics 已覆盖的计数细节再抄成脆弱 SQL
        - 多时间窗口或多指标只填 1 条“模板字段”，未按笛卡尔积展开成独立列
        - 把“3 个周期 × 3 个特征”误记成 3 列或 6 列，而不是 9 列
        - 把 feature_key 组件误当成可省略的输出列，或反过来在本字段重复堆砌主键列却漏掉指标列
        - 多个特征聚合粒度不同却只写一个全局粒度，或聚合字段漏填 aggregation_grain
        - 把时间窗口（近7天/近30天）误当成 aggregation_grain；窗口属于过滤/分支，粒度是 GROUP BY 键
    few_shots:
      - input: 用户要求输出 user_id、app_id、download_count 三个字段，其中 download_count 是 app_id 在 30 天内的下载次数；feature_key 已确认为 user_id+app_id
        output:
          field_id: output_fields
          value:
            fields:
              - field_name: download_count
                source: dm.app_id
                expression: 近30天下载次数（行计数）
                output_type: bigint
                description: 30天内应用下载次数
                aggregation_grain: [user_id, app_id]
          unresolved: []
          rationale: user_id/app_id 已由 feature_key 覆盖；download_count 只写语义口径与聚合粒度，不写具体 SQL。
      - input: 用户要求按近7天、近30天、近90天三个时间窗口，分别输出下载次数、活跃天数、付费金额三个特征（共 3×3=9 列），主键为 device_id；全部按 device_id 聚合
        output:
          field_id: output_fields
          value:
            fields:
              - field_name: download_cnt_7d
                source: evt.app_id
                expression: 近7天下载次数（行计数）
                output_type: bigint
                description: 近7天下载次数
                aggregation_grain: [device_id]
              - field_name: active_days_7d
                source: evt.pt_d
                expression: 近7天活跃天数（按自然日去重计数）
                output_type: bigint
                description: 近7天活跃天数
                aggregation_grain: [device_id]
              - field_name: pay_amt_7d
                source: evt.amount
                expression: 近7天付费金额求和
                output_type: decimal(18,2)
                description: 近7天付费金额
                aggregation_grain: [device_id]
              - field_name: download_cnt_30d
                source: evt.app_id
                expression: 近30天下载次数（行计数）
                output_type: bigint
                description: 近30天下载次数
                aggregation_grain: [device_id]
              - field_name: active_days_30d
                source: evt.pt_d
                expression: 近30天活跃天数（按自然日去重计数）
                output_type: bigint
                description: 近30天活跃天数
                aggregation_grain: [device_id]
              - field_name: pay_amt_30d
                source: evt.amount
                expression: 近30天付费金额求和
                output_type: decimal(18,2)
                description: 近30天付费金额
                aggregation_grain: [device_id]
              - field_name: download_cnt_90d
                source: evt.app_id
                expression: 近90天下载次数（行计数）
                output_type: bigint
                description: 近90天下载次数
                aggregation_grain: [device_id]
              - field_name: active_days_90d
                source: evt.pt_d
                expression: 近90天活跃天数（按自然日去重计数）
                output_type: bigint
                description: 近90天活跃天数
                aggregation_grain: [device_id]
              - field_name: pay_amt_90d
                source: evt.amount
                expression: 近90天付费金额求和
                output_type: decimal(18,2)
                description: 近90天付费金额
                aggregation_grain: [device_id]
          unresolved: []
          rationale: 3×3 展开为9列；expression 只用语义说明，避免写出易错 SQL；粒度均为 [device_id]。
      - input: 同一用户特征表中，user_download_cnt 按 user_id 聚合统计下载次数，user_top_category 先按 user_id+category 聚合再取 Top1 类目；两特征聚合粒度不同
        output:
          field_id: output_fields
          value:
            fields:
              - field_name: user_download_cnt
                source: evt.app_id
                expression: 用户下载次数（行计数）
                output_type: bigint
                description: 用户下载次数
                aggregation_grain: [user_id]
              - field_name: user_top_category
                source: evt.category
                expression: 用户下载量最高的类目（先按用户+类目聚合再取Top1）
                output_type: string
                description: 用户下载量最高的类目
                aggregation_grain: [user_id, category]
          unresolved: []
          rationale: 两特征粒度分列；Top1 类目只写业务步骤语义，不编造 arg_max 等具体函数写法。
      - input: 用户只要求统计总销售额，没有明确输出字段列表
        output:
          field_id: output_fields
          value:
            fields:
              - field_name: total_amount
                source: orders.amount
                expression: 销售总额求和
                output_type: decimal(18,2)
                description: 销售总额
                aggregation_grain: []
          unresolved: []
          rationale: 未列字段时按“总销售额”语义推导一列；expression 保持语义级。
    writable_template:
      field_id: output_fields
      value:
        fields:
          - field_name: null
            source: null
            expression: null
            output_type: null
            description: null
            aggregation_grain: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field_name, source, expression, output_type, description, aggregation_grain]
            properties:
              field_name: {type: string, minLength: 1}
              source: {type: [string, "null"]}
              expression: {type: [string, "null"]}
              output_type: {type: string, minLength: 1}
              description: {type: string, minLength: 1}
              aggregation_grain:
                type: [array, "null"]
                items: {type: string, minLength: 1}

  - field_id: aggregation_metrics
    title: 聚合指标定义
    purpose: 定义计数、求和、均值等聚合指标的计算口径，明确聚合粒度和计数语义。
    field_instructions:
      global_rules:
        - 计数类指标必须明确是记录行数（row_count）、去重计数（distinct_count）还是条件计数（conditional_count）
        - count_type=row_count 表示统计原始记录行数（COUNT(1)），不得因为 metric 名称包含”用户数量””设备数量”等自然语言语义而自动改写为 COUNT(DISTINCT ...)
        - count_entity 描述每个计数单元代表的业务实体（record_row 表示原始行；session、device、user 等表示用户/证据以业务实体指代”记录”时的计数主体）。用户问题中的”记录/数量”指代业务实体（如”不同 session””每个设备””用户数”）时必须填写 count_entity，不得默认写成 record_row
        - count_entity 非 record_row 时，若源表在该实体上不唯一（同一实体可能对应多行），必须改用 count_type=distinct_count 并填写 distinct_field=实体字段，或先聚合到实体唯一粒度；只有源表粒度与计数实体一致（每个实体恰好一行）时才允许 row_count
        - count_type=distinct_count 表示去重计数（COUNT(DISTINCT field)）
        - count_type=conditional_count 表示带条件的行数计数，必须填写 expression_template 字段，如 SUM(IF(isempty(field),0,1))
        - count_type=row_count 时 distinct_field 必须为 null；count_type=distinct_count 时 distinct_field 必须明确；count_type=conditional_count 时 expression_template 必须填写
        - count metric 的计数条件属于当前 metric 的 filter_condition，不得自动提升为 fact_filters；只有用户明确要求过滤事实记录时才写入 fact_filters
        - 聚合分组键必须明确
        - 比例类指标必须明确分子分母来源，且分子分母不能有包含关系（分子不应等于分子+分母，否则结果恒为1）
        - 比例指标必须填写 description 来说明业务语义，用于验证分子分母逻辑是否正确
        - 聚合指标必须与 output_fields 中的聚合字段对应
        - 每个 metric 的 group_by 即该指标的聚合粒度；不同指标允许不同 group_by，必须逐指标填写，禁止把全部指标默认写成同一分组键
        - 当 output_fields 中多个特征的 aggregation_grain 不一致时，对应 metric 的 group_by 必须与各自 aggregation_grain 对齐；不得只保留一种粒度
        - 时间窗口差异（近7天 vs 近30天）不是 group_by 差异；窗口应体现在 filter_condition / 分支，不得误写入 group_by
      subfields:
        count_metrics: 计数指标列表，包含 metric_name、count_type、count_entity、distinct_field、group_by（该指标聚合粒度）、filter_condition、expression_template
        ratio_metrics: 比例指标列表，包含 metric_name、numerator、denominator、precision、description
        avg_metrics: 均值指标列表，包含 metric_name、numerator、denominator、group_by（该指标聚合粒度）
      completion_conditions:
        - 计数口径明确（row_count vs distinct_count vs conditional_count）
        - 计数实体明确（count_entity 已填写，或可明确判定为 record_row）
        - conditional_count 时 expression_template 必须填写
        - 如果用户明确给出”非空记录行数””满足条件的记录数”等计数条件，必须使用 conditional_count 并填写 expression_template
        - 比例指标必须填写 description 来说明业务语义
        - 比例/均值计算的分子分母有明确来源，且逻辑关系正确
        - 聚合分组键明确；存在多种聚合粒度时各 metric 的 group_by 均可区分且与对应输出字段一致
      common_errors:
        - 把”用户数量”默认解释成 COUNT(DISTINCT 用户标识)，忽略用户明确给出的”记录行数/非空记录行数”等统计口径
        - 把用户以业务实体指代”记录”的计数（如”不同session””设备数”）直接当原始行计数，忽略 count_entity 语义
        - 计数实体非 record_row 但源表在实体上不唯一时仍用 row_count，未用 distinct_count 或先聚合到实体粒度
        - 把 count metric 的条件错误写入 fact_filters，导致其他指标也被过滤
        - 把 row_count 改写为 COUNT(DISTINCT field)
        - 把 conditional_count 的 expression_template 留空
        - 比例指标分子分母有包含关系（如分子=活跃+非活跃，分母=总数，导致结果恒为1）
        - 比例指标不填写 description，导致无法验证分子分母逻辑
        - 聚合粒度与分组键不一致
        - 分子分母来源不明确
        - 不同特征聚合粒度不同却给所有 metric 填相同 group_by
        - 把时间窗口差异误写成 group_by 差异
    few_shots:
      - input: 用户要求统计每日活跃用户数，按 user_id 去重
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: daily_active_users
                count_type: distinct_count
                count_entity: user
                distinct_field: user_id
                group_by: [pt_d]
                filter_condition: null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: 按 user_id 去重计数对应 distinct_count(user_id)，分组 pt_d。
      - input: 用户要求统计每个榜单下不同 session 的数量，数据源为 session 级表（每设备每会话每榜单恰好一行，同一 session 在同一榜单内唯一）
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: session_count
                count_type: row_count
                count_entity: session
                distinct_field: null
                group_by: [list_id]
                filter_condition: null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: session 级表每榜单内 session 唯一，直接按行计数，分组 list_id。
      - input: 用户要求统计每个应用的去重设备数，同一设备可能多次出现
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: device_count
                count_type: distinct_count
                count_entity: device
                distinct_field: device_id
                group_by: [app_id]
                filter_condition: null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: 同一设备可能多次出现，去重设备数对应 distinct_count(device_id)，分组 app_id。
      - input: 用户要求统计用户下载次数（记录行数），以及去重后的应用数
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: download_count
                count_type: row_count
                count_entity: record_row
                distinct_field: null
                group_by: [user_id]
                filter_condition: null
              - metric_name: app_count
                count_type: distinct_count
                count_entity: app
                distinct_field: app_id
                group_by: [user_id]
                filter_condition: null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: 下载次数按记录行数计数，应用数按 app_id 去重计数，均按 user_id 分组。
      - input: 用户要求统计使用时间非空的记录行数
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: usage_record_count
                count_type: row_count
                count_entity: record_row
                distinct_field: null
                group_by: [system_tag]
                filter_condition: user_use_total_mins_30d is_not_null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: 统计使用时间非空的记录行数，row_count 且 filter_condition 为 is_not_null。
      - input: 用户要求计算下载成功率的百分比，成功次数/总尝试次数
        output:
          field_id: aggregation_metrics
          value:
            count_metrics: []
            ratio_metrics:
              - metric_name: download_success_rate
                numerator: download_success_count
                denominator: download_total_count
                precision: 4
            avg_metrics: []
          unresolved: []
          rationale: 下载成功率是比例指标，按分子成功次数/分母总尝试次数填入 ratio_metrics。
      - input: 同一任务中 user_download_cnt 按 user_id 聚合，user_category_download_cnt 按 user_id+category 聚合
        output:
          field_id: aggregation_metrics
          value:
            count_metrics:
              - metric_name: user_download_cnt
                count_type: row_count
                count_entity: record_row
                distinct_field: null
                group_by: [user_id]
                filter_condition: null
              - metric_name: user_category_download_cnt
                count_type: row_count
                count_entity: record_row
                distinct_field: null
                group_by: [user_id, category]
                filter_condition: null
            ratio_metrics: []
            avg_metrics: []
          unresolved: []
          rationale: 两指标聚合粒度不同，分别填写 group_by=[user_id] 与 [user_id, category]，禁止统一成单一粒度。
    writable_template:
      field_id: aggregation_metrics
      value:
        count_metrics:
          - metric_name: null
            count_type: null
            count_entity: null
            distinct_field: null
            group_by: []
            filter_condition: null
            expression_template: null
        ratio_metrics:
          - metric_name: null
            numerator: null
            denominator: null
            precision: null
            description: null
        avg_metrics:
          - metric_name: null
            numerator: null
            denominator: null
            group_by: []
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [count_metrics, ratio_metrics, avg_metrics]
      properties:
        count_metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric_name, count_type, count_entity, distinct_field, group_by, filter_condition]
            properties:
              metric_name: {type: string, minLength: 1}
              count_type: {enum: [row_count, distinct_count, conditional_count, null]}
              count_entity: {type: [string, "null"], description: "每个计数单元代表的业务实体，如 record_row、session、device、user。用户以业务实体指代'记录'时必须填写。"}
              distinct_field: {type: [string, "null"]}
              group_by: {type: array, items: {type: string}}
              filter_condition: {type: [string, "null"]}
              expression_template: {type: [string, "null"], description: "具体的SQL聚合表达式片段，用于生成最终SQL。例如：SUM(IF(isempty(field),0,1))、COUNT(1)、COUNT(DISTINCT field)。当count_type=conditional_count时必须填写此字段。"}
        ratio_metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric_name, numerator, denominator, precision]
            properties:
              metric_name: {type: string, minLength: 1}
              numerator: {type: string, minLength: 1}
              denominator: {type: string, minLength: 1}
              precision: {type: [integer, "null"]}
              description: {type: [string, "null"], description: "比例指标的业务语义说明，用于验证分子分母逻辑是否正确。例如：转化率=活跃转化数/下载总数，注意分子不应包含分母的所有记录。"}
        avg_metrics:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [metric_name, numerator, denominator, group_by]
            properties:
              metric_name: {type: string, minLength: 1}
              numerator: {type: string, minLength: 1}
              denominator: {type: string, minLength: 1}
              group_by: {type: array, items: {type: string}}

  - field_id: aggregation_precedence
    title: 去重与聚合的先后关系
    purpose: 定义事实表去重、维度关联、聚合计算之间的执行顺序和依赖关系，避免聚合粒度与去重粒度冲突；多特征多粒度时用 aggregation_stages 逐阶段说明。
    field_instructions:
      global_rules:
        - 当存在 fact_deduplication 或 dimension_deduplication 时，必须明确聚合是基于去重前还是去重后的数据
        - 如果去重后的记录会参与聚合，必须说明聚合粒度与去重粒度的关系
        - 如果去重发生在聚合之后，必须明确使用什么作为去重后的聚合输入
        - 如果用户明确要求“基于原始记录”“基于用户-应用记录”“不要使用预聚合字段”等，必须将输入粒度写入 input_grain，并禁止 SQL Agent 用更高层级的预聚合字段替代
        - 同一任务存在多个聚合粒度时，必须在 aggregation_stages 中为每个粒度各建一个 stage（group_by / output_metrics / depends_on），禁止只用单一 aggregation_key 覆盖全部特征，禁止 SQL Agent 自行统一粒度或改变聚合顺序
        - 多粒度时 aggregation_key 可填最终落到输出主键/最粗公共分组键，但不得据此推断所有指标都按该键聚合；各特征真实粒度以 output_fields.aggregation_grain 与对应 stage.group_by 为准
        - 任务不涉及聚合（无 count/sum/avg 等指标，仅过滤/转换/排序/截断）时，本字段不填写：deduplication_before_aggregation 填 false，aggregation_key 填空数组，count_semantics 填 null，input_grain 填 null；禁止因“每个X”“按X”等表述推断出聚合。
        - input_grain 描述参与聚合的输入记录粒度，即每个计数单元代表的业务实体，须与 aggregation_metrics.count_entity 一致（如 fact_record、session_record、user_record）；当计数实体非 fact_record 且源表在该实体上不唯一（同一实体对应多行）时，SQL 必须先聚合/去重到该实体粒度再计数，禁止直接对原始行 COUNT。input_grain 不代表需要按该粒度预先分组或去重，禁止把 input_grain 当作聚合分组键或去重依据。
      subfields:
        deduplication_before_aggregation: 聚合是基于去重前的原始记录还是去重后的记录
        aggregation_key: 任务级默认/最粗公共聚合分组键；多粒度场景不得单独作为全部特征的粒度权威
        count_semantics: count/sum等聚合函数的行为定义（每行计数 vs 去重后计数）
        input_grain: 聚合输入数据粒度（即计数实体，与 aggregation_metrics.count_entity 一致），例如 fact_record、session_record、user_record
        aggregation_stages: 多阶段/多粒度聚合列表，每项包含 stage_id、input_grain、group_by（该阶段聚合粒度）、output_metrics（产出的指标/输出字段名）、depends_on
      completion_conditions:
        - 聚合与去重的执行顺序明确
        - 聚合粒度与去重粒度的关系明确
        - 聚合输入粒度明确；存在多阶段或多粒度聚合时各阶段 group_by / output_metrics / depends_on 明确
      common_errors:
        - 假设 fact_deduplication 必然先于聚合执行
        - 假设 count(1) 等同于 count(DISTINCT key)
        - 聚合粒度比去重粒度粗时未说明聚合基于去重前数据
        - 用户要求基于原始记录计算，却错误使用事实表中预聚合后的应用粒度字段
        - 多阶段聚合时错误地在不同粒度之间直接复用聚合结果
        - 无聚合任务却填写 aggregation_key、count_semantics 或 input_grain
        - 把 input_grain（聚合输入粒度）误用作分组键或去重依据
        - 输出特征存在多种聚合粒度却只填单一 aggregation_key，未用 aggregation_stages 分列
    few_shots:
      - input: 事实表去重键为 [app_id, device_id, pt_d]，最终按 app_id 聚合计数下载次数
        output:
          field_id: aggregation_precedence
          value:
            deduplication_before_aggregation: false
            aggregation_key: [app_id]
            count_semantics: row_count
          unresolved: []
          rationale: 聚合计数在事实表去重之后进行，按 app_id 分组且为行数口径。
      - input: 事实表去重后按 user_id 统计去重设备数
        output:
          field_id: aggregation_precedence
          value:
            deduplication_before_aggregation: true
            aggregation_key: [user_id]
            count_semantics: distinct_count
          unresolved: []
          rationale: 先去重再按 user_id 统计去重设备数，对应 distinct_count。
      - input: 用户要求统计每日每设备的下载次数，事实表可能存在重复
        output:
          field_id: aggregation_precedence
          value:
            deduplication_before_aggregation: true
            aggregation_key: [pt_d, device_id]
            count_semantics: row_count
          unresolved: []
          rationale: 事实表可能重复，须先按去重键去重再按 pt_d/device_id 聚合，行数口径。
      - input: 同一任务输出 user_download_cnt（按 user_id 聚合）与 user_category_download_cnt（按 user_id+category 聚合），再回挂到用户主键
        output:
          field_id: aggregation_precedence
          value:
            deduplication_before_aggregation: false
            aggregation_key: [user_id]
            count_semantics: row_count
            input_grain: fact_record
            aggregation_stages:
              - stage_id: agg_user
                input_grain: fact_record
                group_by: [user_id]
                output_metrics: [user_download_cnt]
                depends_on: []
              - stage_id: agg_user_category
                input_grain: fact_record
                group_by: [user_id, category]
                output_metrics: [user_category_download_cnt]
                depends_on: []
          unresolved: []
          rationale: 两特征粒度不同，用两个 aggregation_stages 分别记录 group_by；aggregation_key 仅表示最终用户主键粒度，不覆盖类目级指标。
    writable_template:
      field_id: aggregation_precedence
      value:
        deduplication_before_aggregation: null
        aggregation_key: []
        count_semantics: null
        input_grain: null
        aggregation_stages:
          - stage_id: null
            input_grain: null
            group_by: []
            output_metrics: []
            depends_on: []
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [deduplication_before_aggregation, aggregation_key, count_semantics, input_grain, aggregation_stages]
      properties:
        deduplication_before_aggregation:
          type: [boolean, "null"]
        aggregation_key:
          type: array
          items: {type: string}
        count_semantics:
          type: [string, "null"]
        input_grain:
          type: [string, "null"]
        aggregation_stages:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stage_id, input_grain, group_by, output_metrics, depends_on]
            properties:
              stage_id: {type: string, minLength: 1}
              input_grain: {type: string, minLength: 1}
              group_by: {type: array, items: {type: string}}
              output_metrics: {type: array, items: {type: string}}
              depends_on: {type: array, items: {type: string}}
