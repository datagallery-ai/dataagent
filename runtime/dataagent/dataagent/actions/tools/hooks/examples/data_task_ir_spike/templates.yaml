- field_id: pipeline
  title: 执行管道
  purpose: 仅描述跨特征共享的操作层级与顺序；不含聚合粒度或计数语义。
  field_instructions:
    global_rules:
    - 禁止在此填写 aggregation_key / group_by / count_semantics / input_grain / stages。
    - 粒度与计数只在 output_features；本字段只回答“先做什么、作用在哪一层”。
    - sources 中事实层去重按其作用层级解释；除此之外，不凭默认习惯填写执行顺序。JOIN 扇出必须保留，除非证据明确要求 JOIN 后去重且去重键含扇出维度。
    - 有 window_rank（role=rank）时，依据已确认的指标依赖确定 operation_order；不能确定先后关系时留空，不默认添加 aggregate。
    - 无聚合任务时 operation_order 可不含 aggregate。
    subfields:
      deduplication_before_join: 事实去重是否在 JOIN 前
      deduplication_before_aggregation: 聚合是否基于去重后数据
      operation_order: 有序阶段名列表
    completion_conditions:
    - 存在去重或 JOIN 或 rank 时，相关布尔值与 order 明确
    common_errors:
    - 把 grain 写回本字段
    - JOIN 后按事实键折叠扇出
  few_shots:
  - input: 先事实去重，再 LEFT JOIN 维表（保留扇出），再按设备聚合，再 NTILE
    output:
      field_id: pipeline
      value:
        deduplication_before_join: true
        deduplication_before_aggregation: true
        operation_order:
        - fact_dedup
        - join
        - aggregate
        - window_rank
      unresolved: []
      rationale: 扇出需保留故先去重再 JOIN；百分位在聚合后。
  writable_template:
    field_id: pipeline
    value:
      deduplication_before_join: null
      deduplication_before_aggregation: null
      operation_order: []
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - deduplication_before_join
    - deduplication_before_aggregation
    - operation_order
    properties:
      deduplication_before_join:
        type:
        - boolean
        - 'null'
      deduplication_before_aggregation:
        type:
        - boolean
        - 'null'
      operation_order:
        type: array
        items:
          enum:
          - fact_filter
          - fact_dedup
          - join
          - aggregate
          - window_rank
          - sequence
- field_id: sequence
  title: 最终序列后处理
  purpose: 定义逻辑序列的分区、排序、去重与 TopN；无序列需求时整段 not applicable。
  field_instructions:
    global_rules:
    - 无 TopN/序列去重/序列排序时：partition_fields=[]，其余 null/空，表示不适用。
    - 序列分区 ≠ 聚合 grain ≠ 窗口 partition_by（rank.partition_by）。
    - “前 N”用 truncation；行号作为输出列属于 output_features.role=rank，不在此截断。
    - 按主键压最终一行时用 dedup；identity_ref 优先 identity。
    subfields: partition_fields / ordering / dedup / truncation / window_partition
    completion_conditions:
    - 有 TopN 时 truncation 与 ordering 明确；有序列去重时 dedup 明确
    common_errors:
    - 把聚合 grain 写成序列分区
    - 把 NTILE 写进 truncation
  few_shots:
  - input: 每设备保留 weight 最大的 10 个应用
    output:
      field_id: sequence
      value:
        partition_fields:
        - device_id
        null_equality: nulls_distinct
        ordering:
        - field_ref: weight
          direction: desc
          value_type: number
          null_rank: last
        dedup: null
        truncation:
          limit_per_partition: 10
          tie_behavior: retain_all
        window_partition: null
      unresolved: []
      rationale: 设备内按 weight 排序取 Top10。
  writable_template:
    field_id: sequence
    value:
      partition_fields: []
      null_equality: null
      ordering: []
      dedup: null
      truncation: null
      window_partition: null
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - partition_fields
    - null_equality
    - ordering
    - dedup
    - truncation
    - window_partition
    properties:
      partition_fields:
        type: array
        items:
          type: string
      null_equality:
        enum:
        - nulls_equal
        - nulls_distinct
        - null
      ordering:
        type: array
      dedup:
        type:
        - object
        - 'null'
      truncation:
        type:
        - object
        - 'null'
      window_partition:
        type:
        - object
        - 'null'
        description: 仅当存在与最终序列不同的独立窗口 PARTITION BY 时填写
