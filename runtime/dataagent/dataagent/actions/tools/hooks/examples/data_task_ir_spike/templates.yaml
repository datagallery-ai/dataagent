# DataTaskIR template catalog v1.0.0
# Six field units: identity, sources, time_context, output_features, pipeline, sequence.
template_id: data_task_ir
template_version: 1.0.0
language: zh-CN
contract:
- 每个 field unit 独立调用模型；只能修改当前 writable_template 中出现的字段。
- 输出必须是单个 JSON 对象；field_id、value、rationale 必填；unresolved/question 按需。
- null 表示证据不足，不表示沿用旧值；数组无项时填空数组。
- 整个字段或任意子字段均允许信息不完备；required 只描述键结构，不要求猜测业务值。缺少的键可由程序补为 null。
- completion_conditions 仅描述信息齐备状态，不是必须填满的要求；只提取已有证据，不为满足齐备条件而发明口径。
- 未涉及的操作不新增、不强制追问；只有影响当前任务正确实现的缺失或冲突才写 unresolved/question。
- 禁止把“通常/默认/建议/prefer”写成已确认口径。
- 冲突时受影响槽位保持 null/空数组，并写 unresolved，禁止选边。
- few-shot 只演示协议，禁止复制业务值。
- 禁止在多个 field unit 中重复填写同一口径；若某信息已有权威位置，其他字段只引用。
output_contract:
  field_id: 必填；固定为当前 Field Unit 的 field_id。
  value: 必填；结构遵循 writable_template。
  rationale: 必填。
  unresolved: 可选字符串数组。
  question: unresolved 非空时必填。
predicate_protocol:
  shape_keys:
  - source_ref
  - field_ref
  - operator
  - operand_type
  - operands
  - null_semantics
  - filter_scope
  - branch_ref
  operator_enum:
  - eq
  - ne
  - in
  - not_in
  - gt
  - gte
  - lt
  - lte
  - between
  - is_null
  - is_not_null
  - not
  - null
  mapping_rules_inherited:
  - “非零/不等于零/忽略为零” → operator=ne, operands=["0"]；禁止写成 gt
  - 字符串类型空值判断（“为空/非空/不为空/过滤空值”且字段为字符串存储）→ 统一用 bicoredata.IsEmpty：判空表达 `bicoredata.IsEmpty(xxx)`；判非空为 operator=not, operands=["bicoredata.IsEmpty(xxx)"]（或经元数据确认的等价写法）。禁止对 STRING 字段用 is_null / is_not_null 或 IS NULL / IS NOT NULL、= '' / <> '' 凑合
  - 区分存储类型与业务语义：① 语义非字符串但按字符串存储（时间/次数/金额等存 STRING）→ 仍映射 bicoredata.IsEmpty；② 元数据证实为非字符串类型存储 → 不适用 bicoredata.IsEmpty，用 is_null / is_not_null。不得用业务语义代替 schema
  - operands 一律用字符串保存；between 恰好两个值；is_null/is_not_null 用 []（仅用于非字符串类型存储、且空值仅为 SQL NULL；字符串存储的空值/非空默认走 bicoredata.IsEmpty）
  required_always:
  - field_ref
  - operator
  optional_fields:
  - source_ref
  - operand_type
  - operands
  - null_semantics
  - filter_scope
  - branch_ref
  conditional_required:
  - when: operator 需要常量（eq/ne/in/gt/...）且证据已给出常量
    require:
    - operands
  - when: filter_scope == window_branch 且当前 feature/context 没有可用 window_ref
    require:
    - branch_ref
  - when: filter_scope == window_branch 且已有 window_ref
    require: []
    note: branch_ref 可省略，默认等于 window_ref
  defaults:
    source_ref:
      in_sources_facts_or_dimensions: 省略则使用外层 source_ref
      in_output_features_filters: 省略则尝试 feature.source；仍不明则 null，不编造
    filter_scope:
      in_sources_filters: 省略则默认 source_level
      in_output_features_filters_with_window_ref: 省略则视为该 window_ref 分支过滤（等价 window_branch）
      in_output_features_filters_without_window_ref: 省略则默认 source_level；无法判定则 null + unresolved
    branch_ref:
      when_window_ref_present: 可省略（= window_ref）
      when_filter_scope_window_branch_without_window_ref: 必填
      otherwise: null
    operand_type: 证据不足时保持 null，禁止猜测 string/number
    null_semantics: 证据不足时保持 null
    operands: operator 为 is_null/is_not_null 时用 []；其他缺证据时 null 或省略并 unresolved
  forbidden:
  - 不得新增 shape_keys 以外的键（additionalProperties=false）
  - 不得为“填满可选字段”而 invent operand_type / null_semantics / branch_ref
  - 不得把列级过滤提升写进 sources.facts[].filters（或反向把共享过滤抄进每个 feature）
fields:
- field_id: identity
  title: 特征主键
  purpose: >
    定义最终特征记录的逻辑主键（分组键/实体键）。已确认 components 是最终输出的唯一定义处与必选前缀列；
    不得在 output_features 中再作为业务列重复出现。
  field_instructions:
    global_rules:
    - 只填最终逻辑主键，不得把源表物理主键、去重键、join 键自动当成特征主键。
    - 已确认 components 必须作为 INSERT SELECT 前缀列输出；这是主键列在 IR 中的唯一权威位置。
    - '【禁止双写】identity.components[].field_ref 不得再出现在 output_features 的 measures/extras/features 的 measure_id、field_name，或作为“单独一列指标/维度特征”重复描述（包括把分组键再写成 role=metric/derived）。唯一例外：用户明确要求输出主键别名列时可用 role=key_alias，且 field_name 必须与 field_ref 不同。'
    - 聚合维度与主键的关系：若某列既是最终记录主键又是聚合分组键，只在 identity 声明；
      output_features 的 aggregation.grain 可以**引用**同一 field_ref（表示按该键聚合），但不得再把它展开成输出特征列。
    - identity 只定义输出前缀键。仅当用户**明确要求不要去重**时：不得因 identity 存在而要求 output_features 填写 grain
      或 sources 填写 dedup。常规聚合任务用户往往不显式说“要聚合/GROUP BY”，有求和/计数/均值等聚合语义时仍可正常填 grain。
    - 不要为了“用户输出列表里写了 device_id”就把主键抄进 output_features；列表中的主键项由 identity 覆盖。
    - 冲突且无优先级时 components 置空并 unresolved。
    subfields:
      components: 联合键顺序的 field_ref / semantic_role / null_semantics（= 最终输出前缀列清单）
      uniqueness_scope: final_dataset | within_statistic_period | within_sequence_partition
    completion_conditions:
    - 有主键证据时提取 components；null_semantics/uniqueness_scope 无证据时留空，不为确认主键强制补齐这些子字段
    common_errors:
    - 因主键未出现在用户输出列表而省略
    - 把明细行 id 当作用户/设备特征主键
    - 把主键/分组键同时写进 identity 与 output_features（列重复）
    - 误以为 grain 引用主键不够、还必须在 features 再出一列同名键
  few_shots:
  - input: 每个设备一条特征；device_id 不允许为空
    output:
      field_id: identity
      value:
        components:
        - field_ref: device_id
          semantic_role: 设备
          null_semantics: reject_record
        uniqueness_scope: final_dataset
      unresolved: []
      rationale: 用户要求设备级特征，证据说明 device_id 非空，故为主键。
  writable_template:
    field_id: identity
    value:
      components:
      - field_ref: null
        semantic_role: null
        null_semantics: null
      uniqueness_scope: null
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - components
    - uniqueness_scope
    properties:
      components:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - field_ref
          - semantic_role
          - null_semantics
          properties:
            field_ref:
              type: string
              minLength: 1
            semantic_role:
              type: string
              minLength: 1
            null_semantics:
              enum:
              - nulls_equal
              - nulls_distinct
              - reject_record
              - conflict
              - null
      uniqueness_scope:
        enum:
        - final_dataset
        - within_statistic_period
        - within_sequence_partition
        - null
- field_id: sources
  title: 数据源与关联预处理
  purpose: 定义事实/维度源的共享过滤、派生、去重，以及 JOIN 关系与扇出语义。
  field_instructions:
    global_rules:
    - 只填写对多列共享的预处理与关联；某一输出列私有的过滤/窗口写到 output_features.filters。
    - filters[] 使用共用 predicate_protocol：保留 0.8.0 谓词键集合，仅 field_ref、operator 必填，其余可选；缺省规则见文件顶部 predicate_protocol.defaults。
    - 在 facts[i]/dimensions[i] 内写过滤时，谓词可省略 source_ref（默认外层 source_ref）。
    - 维表关联键不唯一时 cardinality 必须标 one_to_many / many_to_many，不得掩盖扇出。
    - 事实层 dedup 作用于 JOIN 前事实行；是否先去重再 JOIN 由 pipeline.deduplication_before_join 决定。
    - 仅当用户明确要求不要去重时：facts/dimensions 的 dedup 必须为 null，禁止 invent 去重键或 record_selection。
      常规任务有去重证据时仍可按证据填写；不要把本条理解成默认禁止 dedup。
    - 无维度关联时 dimensions 填空数组。
    subfields:
      facts: 事实源列表（source_ref/filters/derived/dedup）
      dimensions: 维度源列表（source_ref/filters/derived/dedup/join）
    completion_conditions:
    - 任务涉及的事实源均已列出；有 JOIN 时 join 条件与 cardinality 明确
    - 每个共享过滤谓词至少有 field_ref 与 operator；有常量证据时 operands 已填
    common_errors:
    - 把列级指标过滤写进 facts.filters，污染其他指标
    - 有扇出却标 many_to_one
    - 为填满可选字段而编造 operand_type / null_semantics
    - 用户要求不要去重却仍填写 facts/dimensions.dedup
  few_shots:
  - input: 事实表 evt 需 event_type=download；维表 dim_cat 按 category_id LEFT JOIN，一类目多行
    output:
      field_id: sources
      value:
        facts:
        - source_ref: evt
          filters:
          - field_ref: event_type
            operator: eq
            operands:
            - download
          derived: []
          dedup: null
        dimensions:
        - source_ref: dim_cat
          filters: []
          derived: []
          dedup: null
          join:
            fact_source_ref: evt
            join_type: left
            conditions:
            - fact_field: category_id
              dim_field: category_id
            cardinality: one_to_many
            unmatched_fact: keep
      unresolved: []
      rationale: 共享下载事件过滤放 facts；谓词只填有证据的键；维表一对多如实记录。
  writable_template:
    field_id: sources
    value:
      facts:
      - source_ref: null
        filters: []
        derived: []
        dedup: null
      dimensions: []
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - facts
    - dimensions
    properties:
      facts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - source_ref
          - filters
          - derived
          - dedup
          properties:
            source_ref:
              type: string
              minLength: 1
            filters:
              type: array
              items: &id001
                type: object
                additionalProperties: false
                required:
                - field_ref
                - operator
                properties:
                  source_ref:
                    type:
                    - string
                    - 'null'
                  field_ref:
                    type: string
                    minLength: 1
                  operator:
                    enum:
                    - eq
                    - ne
                    - in
                    - not_in
                    - gt
                    - gte
                    - lt
                    - lte
                    - between
                    - is_null
                    - is_not_null
                    - not
                    - null
                  operand_type:
                    enum:
                    - string
                    - number
                    - boolean
                    - null
                  operands:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                  null_semantics:
                    enum:
                    - nulls_equal
                    - nulls_distinct
                    - reject_record
                    - conflict
                    - null
                  filter_scope:
                    enum:
                    - source_level
                    - window_branch
                    - null
                  branch_ref:
                    type:
                    - string
                    - 'null'
            derived:
              type: array
            dedup:
              type:
              - object
              - 'null'
              properties:
                record_identity:
                  type: object
                record_selection:
                  type: object
      dimensions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - source_ref
          - filters
          - derived
          - dedup
          - join
          properties:
            source_ref:
              type: string
              minLength: 1
            filters:
              type: array
              items: *id001
            derived:
              type: array
            dedup:
              type:
              - object
              - 'null'
            join:
              type: object
              required:
              - fact_source_ref
              - join_type
              - conditions
              - cardinality
              properties:
                fact_source_ref:
                  type: string
                join_type:
                  enum:
                  - left
                  - inner
                  - null
                conditions:
                  type: array
                cardinality:
                  enum:
                  - one_to_one
                  - one_to_many
                  - many_to_one
                  - many_to_many
                  - null
                unmatched_fact:
                  enum:
                  - keep
                  - drop
                  - null
                temporal_validity:
                  type:
                  - object
                  - 'null'
- field_id: time_context
  title: 时间上下文
  purpose: 同时定义输出统计分桶与输入回看窗口，避免二者混写。
  field_instructions:
    global_rules:
    - output_bucket 回答“每条输出属于哪个时间桶”；input_windows 回答“取哪些历史事实”。
    - “近 N 天”属于 input_windows，禁止写入 output_bucket.grain。
    - 多窗口任务在 input_windows 中命名各窗口（如 w7d/w30d），供 output_features.window_ref 引用。
    - 无统计分桶时 output_bucket.grain=none；无回看窗口时 input_windows=[]。
    subfields:
      output_bucket: time_field/grain/timezone/calendar/week_start/custom_definition
      input_windows: 命名窗口列表（window_id/time_field/anchor/range/boundary）
    completion_conditions:
    - 涉及时间时 output_bucket 或 input_windows 至少一侧有证据且二者不混用
    common_errors:
    - 把近30天写成 grain=day
    - 多窗口不命名导致 features 无法引用
  few_shots:
  - input: 按天输出；计算近7天与近30天下载
    output:
      field_id: time_context
      value:
        output_bucket:
          time_field: pt_d
          grain: day
          timezone: Asia/Shanghai
          calendar: gregorian
          week_start: null
          custom_definition: null
        input_windows:
        - window_id: w7d
          time_field: event_time
          anchor: current_partition
          range:
            type: duration
            direction: past
            number: 7
            unit: day
            include_anchor_period: true
          boundary: half_open_right
        - window_id: w30d
          time_field: event_time
          anchor: current_partition
          range:
            type: duration
            direction: past
            number: 30
            unit: day
            include_anchor_period: true
          boundary: half_open_right
      unresolved: []
      rationale: 输出按 pt_d 日桶；两个回看窗口分别命名供特征引用。
  writable_template:
    field_id: time_context
    value:
      output_bucket:
        time_field: null
        grain: null
        timezone: null
        calendar: null
        week_start: null
        custom_definition: null
      input_windows: []
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - output_bucket
    - input_windows
    properties:
      output_bucket:
        type: object
        required:
        - time_field
        - grain
        - timezone
        - calendar
        - week_start
        - custom_definition
        properties:
          time_field:
            type:
            - string
            - 'null'
          grain:
            enum:
            - none
            - day
            - week
            - month
            - quarter
            - year
            - custom
            - null
          timezone:
            type:
            - string
            - 'null'
          calendar:
            type:
            - string
            - 'null'
          week_start:
            type:
            - string
            - 'null'
          custom_definition:
            type:
            - string
            - 'null'
      input_windows:
        type: array
        items:
          type: object
          required:
          - window_id
          - time_field
          - anchor
          - range
          - boundary
          properties:
            window_id:
              type: string
              minLength: 1
            time_field:
              type:
              - string
              - 'null'
            anchor:
              type:
              - string
              - 'null'
            range:
              type:
              - object
              - 'null'
            boundary:
              type:
              - string
              - 'null'
- field_id: output_features
  title: 输出特征目录
  purpose: >
    定义除特征主键前缀以外的全部业务/指标输出列口径（最终输出 = identity.components 前缀 + expand(本字段)）。
    多维交叉（如多窗口×多指标）以 axes+measures 紧凑描述并由代码确定性展开；独立列用 layout=flat 的 features[]，
    或 cartesian 下的 extras[]。分组键/主键列不属于本字段的输出列清单。
  field_instructions:
    global_rules:
    - layout 二选一权威：cartesian（默认用于窗口×指标等可因子化交叉）或 flat（列彼此独立）。
    - layout=cartesian 时：只填 axes + measures（+ 可选 overrides/extras）；禁止手写完整交叉列清单。
    - axes[].values 对 window 轴必须引用 time_context.input_windows.window_id；禁止在 measure 内重复定义窗口。
    - measures[] 写指标模板一次（calc/aggregation/filters/attach_rank/name_pattern）；**每个 measure 必须对全部轴组合展开**（不可只出轴的子集）。
    - 判定口诀：该指标是否要对 axes 的每个取值各出一列？是 → measures；否（只出部分窗口/部分轴值，即使与轴有交集）→ extras，并用 window_ref（或等价字段）钉死那一个取值。
    - 展开列名由 name_pattern 确定性生成（默认 "{measure_id}_{window}"）；render 用同一规则展开供主 Agent 对照。
      展开列名不是 SQL/DDL 强制约束，下游可按规范另命名，不得因未照抄同名判失败。
    - 期望业务列数 = ∏|axis.values| × |measures|（每个 measure×轴组合一列）+ |extras|；若 measure.attach_rank 非 null，
      再为每个轴组合追加 1 个 rank 列（name_pattern 默认 "{measure_id}_{window}_pct"），禁止对跨窗口汇总值打一个分位替代分窗口分位。
      **上述列数不含 identity 主键前缀**。
    - overrides 仅用于极少数格子与模板不同；不得用 overrides 穷举笛卡尔积，也不得用 overrides“删掉”不需要的轴组合。
    - extras[]：不参与笛卡尔积的独立列，包括 (1) 多阶段 Top1/全局比率/key_alias；(2) **只需轴上部分取值的指标**（如 A/B 要 7/14/21，C/D 只要 21 → C/D 进 extras 且 window_ref=w21d，禁止因 w21d∈axes 而把 C/D 放进 measures）。
    - layout=flat 时：使用 features[] 逐列描述（同旧 features 语义）；axes/measures 必须为空。
    - calc.intent 语义级，禁止可执行 SQL；aggregation.grain 为该 measure/列的粒度权威（[]=已确认全局聚合；null/未填写本身不确认粒度或是否聚合）。
    - '【grain 是聚合元数据，不是输出列】aggregation.grain 中的 field_ref 表示 GROUP BY / 聚合维度，可与 identity.components 相同或为其超集；这不意味着要在 measures/extras/features 再生成同名输出列。最终输出列清单仍是 identity 前缀 + expand(本字段业务列)。'
    - '【仅当用户明确要求不要去重时，禁止填写 aggregation.grain】（适用范围很窄）用户原话出现“不要去重 / 不去重 / 保留重复行 / 不去重后再算”等时，grain 必须保持 null，且不得因 identity 或“每个应用/设备”而 invent 分组键。此时已确认 grain 易被 nl2sql/质检当成按键折叠（等价去重），与“保留同键多行参与计算”冲突。【默认情况（用户未禁止去重）】多数聚合任务不会显式说“要聚合”；只要有求和/计数/均值/按主体汇总等聚合语义，仍应照常填写 grain，不要因为用户没写“GROUP BY/聚合”就留空 grain。'
    - '【与 identity 防重复（硬规则）】(1) measures[].measure_id、展开后的 field_name、extras[].field_name、features[].field_name 均不得等于任何已确认的 identity.components[].field_ref；(2) 不得把“分组键/实体键/主键”再写成一条 metric/derived 特征；(3) 仅当用户明确要求主键别名输出列时，可用 role=key_alias，且 field_name ≠ 原 field_ref；(4) 用户输出列表里若同时写了主键与指标，主键归 identity，指标归本字段——不要两侧各写一遍主键；(5) 仅在用户明确禁止去重时：不得把 identity 键抄进 grain；常规聚合不受此条限制。'
    - 不同 measure 允许不同 grain；禁止用单一全局粒度覆盖。
    - 列私有过滤放 measure.filters / feature.filters；共享过滤放 sources。
    - filters 使用 predicate_protocol；有 window 轴时展开列自动绑定对应 window_ref。
    - based_on/depends_on 在模板层引用 measure_id 或 extras.field_name；展开后映射到具体列名。
    - TopN 截断写 sequence.truncation，不写本字段。
    subfields:
      layout: cartesian | flat
      axes: 交叉轴（cartesian）
      measures: 指标模板（cartesian；不含主键/分组键列）
      overrides: 稀疏格子覆盖（cartesian）
      extras: 非交叉独立业务列（cartesian；不含主键列）
      features: 逐列清单（flat；不含主键列）
    completion_conditions:
    - cartesian：axes/measures 完整，窗口 id 可解析，name_pattern 可展开且无冲突
    - flat：features 覆盖全部独立业务输出列（不含 identity 前缀）
    - 有聚合语义时填写 grain（用户通常不显式说“聚合”）；仅当用户明确要求不要去重时 grain 必须为 null
    - 展开后的业务列名与 identity.components.field_ref 无交集（key_alias 除外）
    common_errors:
    - 5×3 交叉却逐列写 15 行 features（重复口径）
    - 把近 N 天写进 grain
    - invent SQL 到 calc.intent
    - 用跨窗口汇总值打一个全局百分位替代分窗口百分位
    - cartesian 与 flat 混用且两边都填满造成双权威
    - 部分窗口指标因与 axes 有交集（如只要 w21d，而轴含 w7d/w14d/w21d）被误放进 measures，导致展开列数变成 ∏|axis|×全部指标，与“3×2+2=8”类口径不符；此类必须进 extras
    - rationale 写对了列数（如 3×2+2=8）但 value 把本应 extras 的指标放进 measures（展开会变成 3×4=12）——以 value 槽位为准，必须纠正到 extras
    - 把 device_id/user_id 等主键既写入 identity 又写入 measures/extras/features（或 field_name 与 field_ref 同名）
    - 把 aggregation.grain 中的分组维误当成还要再出一列同名输出特征
    - 用户明确要求不要去重，却仍填写 grain（因 identity/“每个应用”）误导下游折叠多行；或反过来：常规聚合任务因用户未显式说“聚合”而漏填 grain
    - 把“仅禁止去重时不填 grain”误用成默认永远不填 grain
  expansion_spec:
    description: render/verify 使用的确定性展开（非 LLM）
    algorithm: "if layout == flat:\n  columns = features\nelse:  # cartesian\n  columns = []\n  for each\
      \ tuple t in cartesian_product(axes[i].values):\n    binding = {axes[i].axis_id: t[i]}\n    for\
      \ each measure m in measures:\n      col = apply(m, binding)  # window_ref=binding.window if any\n\
      \      col.field_name = format(m.name_pattern or \"{measure_id}_{window}\", binding, m)\n      apply\
      \ matching override patch if any\n      columns.append(col)\n      if m.attach_rank:\n        rank_col\
      \ = derive_rank_column(col, m.attach_rank)\n        rank_col.field_name = format(m.attach_rank.name_pattern\
      \ or \"{measure_id}_{window}_pct\", ...)\n        columns.append(rank_col)\n  columns += extras\n\
      output_columns = identity.components + columns\n"
