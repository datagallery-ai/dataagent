template_id: data_task_ir
template_version: "0.7.0"
language: zh-CN
contract:
  - 每个 field unit 独立调用模型；模型只能修改当前 writable_template 中出现的字段。
  - 输出必须是单个 JSON 对象；field_id 和 value 必须保留，rationale 必须输出，unresolved 和 question 按需输出。
  - 每个输出必须包含 rationale 字段：一段纯文本，说明填写 value 的依据（引用用户原话或工具证据中的具体表述）与关键判断逻辑；即使 value 为空也必须说明为什么没有可填内容。禁止把 rationale 写成与输入无关的套话，禁止编造输入中不存在的依据。
  - null 表示证据明确不足，绝不表示沿用旧值；数组没有可确认项时填空数组。
  - 只使用用户问题、已确认上下文、当前字段值和工具证据；few-shot 只演示格式，绝不是证据。
  - 禁止把“通常、一般、默认、建议、prefer、preference”等模糊表达写成已确认口径。
  - 尽可能提取输入中属于当前 Field Unit 的全部确定内容；允许部分填写，禁止因字段标题未被直接提及而忽略证据。
  - unresolved 只在用户问题涉及当前字段但存在缺失、歧义或无法消解的冲突时输出。
  - unresolved 只能是纯文本字符串数组；禁止输出对象、字典或嵌套结构，没有内容时可省略。
  - unresolved 只记录当前 Field Unit 的直接问题；其他字段的缺失或冲突必须忽略，禁止跨字段传播。
  - 发生冲突时，直接受冲突影响的 value 槽位必须保持 null 或空数组，并在 unresolved 说明，禁止选择任一方。
  - unresolved 非空时必须同时输出 question；question 是一个可直接询问用户的字符串，不能是对象或数组。
  - question 必须说明用户和证据中有无相关信息；没有时说明要补充什么，有时指出具体哪里没说清楚。

output_contract:
  field_id: 必填字符串；固定为当前 Field Unit 的 field_id。
  value: 必填；结构遵循当前 writable_template，并尽可能保留全部有直接证据支持的子字段。
  rationale: 必填字符串；说明填写 value 的依据与关键判断逻辑，引用用户原话或工具证据中的具体表述；value 为空时说明没有证据的原因。
  unresolved: 可选字符串数组；只记录当前字段确实存在的缺失、歧义或冲突。
  question: 可选字符串；仅在 unresolved 非空时输出，并形成可直接向用户提出的澄清问题。

fields:
  - field_id: feature_key
    title: 特征主键
    purpose: 定义最终结果中一条特征记录所代表对象的逻辑唯一标识；已确认的主键列是最终输出的必选前缀列（即使未写入 output_fields）。
    field_instructions:
      global_rules:
        - 只填写最终结果的逻辑主键，不得把源表物理主键、去重键或 join 键自动当成特征主键。
        - 多字段联合主键必须逐项列出；证据没有说明空值等价关系时必须保持 null 并写入 unresolved。
        - 候选主键字段发生无优先级冲突时 components 必须为空，并写入 unresolved；不得先填其中一方再附加说明。
        - 主键字段冲突只影响 components；如果 uniqueness_scope 有独立明确证据，必须保留，不得把整个 value 清空。
        - 已确认的 components 默认出现在最终输出列的最前面；本字段记录身份口径，不必为了“能输出”而改写到 output_fields。
      subfields:
        components: 按联合键顺序填写 field_ref、semantic_role 和 null_semantics。
        uniqueness_scope: 填主键在哪个范围内唯一，只能使用允许的枚举。
      completion_conditions:
        - components 非空，且每个组件均有明确字段引用和空值语义。
        - uniqueness_scope 有明确证据。
      common_errors:
        - 把订单明细 id 当作用户特征主键。
        - 根据字段名猜测 null_semantics。
        - 因主键列未出现在用户“输出字段列表”中，就省略 components 或改写到其他字段。
    few_shots:
      - input: 用户要每个门店每天一条记录；证据说明 store_id 不允许为空。
        output:
          field_id: feature_key
          value:
            components:
              - field_ref: store_id
                semantic_role: 门店
                null_semantics: reject_record
            uniqueness_scope: within_statistic_period
          unresolved: []
          rationale: 用户要求按门店每天一条记录，证据补充 store_id 不允许为空，故以 store_id 为主键并采用 reject_record。
      - input: 只提到“形成用户特征表”，没有给出用户标识字段。
        output:
          field_id: feature_key
          value:
            components: []
            uniqueness_scope: null
          unresolved:
            - 最终特征主键字段及唯一范围未说明
          question: 用户问题需要形成特征记录，但用户和证据都没有给出主键字段及唯一范围；请补充这两项信息。
          rationale: 输入只说明要形成用户特征表，未给出任何主键字段，components 留空并记入 unresolved。
      - input: 每个自然日内主键唯一；工具 A 说主键是 user_id，工具 B 说主键是 account_id，无优先级。
        output:
          field_id: feature_key
          value:
            components: []
            uniqueness_scope: within_statistic_period
          unresolved:
            - 主键字段在 user_id 与 account_id 之间冲突且无优先级
          question: 工具 A 和工具 B 都给出了主键证据，但候选字段冲突且无优先级；请确认应采用哪个字段或证据源。
          rationale: 每日唯一说明唯一范围为统计周期内；但 user_id 与 account_id 证据冲突且无优先级，主键字段不填、记入 unresolved。
    writable_template:
      field_id: feature_key
      value:
        components:
          - field_ref: null
            semantic_role: null
            null_semantics: null
        uniqueness_scope: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [components, uniqueness_scope]
      properties:
        components:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field_ref, semantic_role, null_semantics]
            properties:
              field_ref: {type: string, minLength: 1}
              semantic_role: {type: string, minLength: 1}
              null_semantics:
                enum: [nulls_equal, nulls_distinct, reject_record, conflict, null]
        uniqueness_scope:
          enum: [final_dataset, within_statistic_period, within_sequence_partition, null]

  - field_id: statistic_period
    title: 统计周期
    purpose: 定义最终指标或特征输出所属的时间分桶，不表示输入数据的回看窗口。
    field_instructions:
      global_rules:
        - 统计周期回答“每条输出属于哪个时间桶”；过去 N 天属于 time_window，不得填到这里。
        - 周、月等日历周期必须明确时区和日历；周粒度还必须明确每周起始日。
      subfields:
        time_field: 用于给输出分桶的字段。
        grain: 仅使用允许的标准粒度；非标准周期使用 custom 并填写 custom_definition。
        timezone: 使用 IANA 时区或证据中的明确时区。
        calendar: 如 gregorian、iso_week 或明确业务日历名称。
        week_start: 周粒度填写 monday 至 sunday，其他粒度填 null。
        custom_definition: custom 时给出可执行且无歧义的周期定义，否则填 null。
      completion_conditions:
        - time_field、grain、timezone、calendar 均有证据。
        - grain 为 week 时 week_start 非空；grain 为 custom 时 custom_definition 非空。
      common_errors:
        - 把“过去 7 天”写成 daily。
        - 未经证据补出默认时区。
    few_shots:
      - input: 结果按 event_time 的北京时间自然周输出，每周一开始。
        output:
          field_id: statistic_period
          value:
            time_field: event_time
            grain: week
            timezone: Asia/Shanghai
            calendar: gregorian
            week_start: monday
            custom_definition: null
          unresolved: []
          rationale: 用户明确按 event_time 的北京时间自然周输出、每周一开始，故依次填写 time_field/grain/timezone/week_start。
      - input: 用户只说“按周统计”。
        output:
          field_id: statistic_period
          value:
            time_field: null
            grain: week
            timezone: null
            calendar: null
            week_start: null
            custom_definition: null
          unresolved:
            - 分桶时间字段、时区、日历和每周起始日未说明
          question: 用户提出按周统计，但用户和证据都没有说明分桶时间字段、时区、日历及每周起始日；请补充这些口径。
          rationale: 只有 grain=week 有证据；时间字段、时区、日历与每周起始日均无证据，保持 null 并记入 unresolved。
      - input: 输出按 event_time 自然日分桶，gregorian 日历；工具 A 说时区 Asia/Shanghai，工具 B 说时区 UTC，无优先级。
        output:
          field_id: statistic_period
          value:
            time_field: event_time
            grain: day
            timezone: null
            calendar: gregorian
            week_start: null
            custom_definition: null
          unresolved:
            - 统计周期时区在 Asia/Shanghai 与 UTC 之间冲突且无优先级
          question: 工具 A 和工具 B 都提供了统计周期时区，但 Asia/Shanghai 与 UTC 相互冲突；请确认采用哪个时区。
          rationale: 按明确证据填写 time_field/grain/calendar；时区在 Asia/Shanghai 与 UTC 间冲突且无优先级，故为 null 并记入 unresolved。
    writable_template:
      field_id: statistic_period
      value:
        time_field: null
        grain: null
        timezone: null
        calendar: null
        week_start: null
        custom_definition: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [time_field, grain, timezone, calendar, week_start, custom_definition]
      properties:
        time_field: {type: [string, "null"]}
        grain: {enum: [none, day, week, month, quarter, year, custom, null]}
        timezone: {type: [string, "null"]}
        calendar: {type: [string, "null"]}
        week_start: {enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, null]}
        custom_definition: {type: [string, "null"]}

  - field_id: fact_filters
    title: 事实表过滤条件
    purpose: 定义事实记录进入口径计算集合所必须满足的资格谓词。
    optional: true
    not_applicable_value:
      predicates: []
    field_instructions:
      global_rules:
        - 只记录事实表资格条件；时间窗口、join 条件、字段转换和去重条件分别写入其他 field unit。
        - 一个谓词一项；不得把自然语言“有效数据”等概念直接当作条件，必须落到字段、操作符和值。
        - 仅填写 source_ref 被证据明确标注为事实源的谓词；同一证据中的维度源谓词属于 dimension_filters，必须忽略。
        - 去重 identity 中“键为空时拒绝”只定义记录等价关系，不得转换成 is_not_null 事实过滤；只有证据明确把它表述为事实记录资格条件时才纳入。
        - “非零”“非空”“不等于”“不为”“忽略/排除/过滤掉为零的记录”等自然语言限定词必须映射为 ne 操作符，operands=["0"]；只有用户明确表达“大于 0”“正数”时才使用 gt。ne 表示不等于（仅排除 0，保留负值），gt 表示大于（连负值一起排除），二者语义不同，禁止互相替换；把“忽略为零”记成 gt 会导致质量校验把正确的 != 0 改写成 > 0，造成口径漂移。
        - 每个谓词必须标注作用范围 filter_scope：source_level 表示作用于整个事实源、任何窗口/分支计算之前都生效；window_branch 表示仅作用于指定窗口分支（branch_ref 必须写明，如“7d窗口”），禁止提升为对整个事实源的全局过滤。
        - 同一业务过滤针对多个窗口变体字段（如 user_app_interest_score_7d_sum_up / _14d_sum_up / _30d_sum_up）时，每个变体必须单独记录一个 window_branch 谓词并各自标注 branch_ref；禁止合并成“三个字段同时满足”的全局过滤，那会把仅在部分窗口有非零数据的用户整体排除。
        - 数值比较的 operands 必须使用数值原文（如 "0"），operand_type 必须与字段类型一致（number）；禁止把数值比较的 operand_type 记成 string。
      subfields:
        predicates: 填 source_ref、field_ref、operator、operand_type、operands、null_semantics、filter_scope、branch_ref。
        operands: 所有常量使用字符串保存；between 恰好两个值，is_null/is_not_null 使用空数组。
        filter_scope: source_level 或 window_branch；有明确证据时按证据填写，无法判定时填 null 并写入 unresolved。
        branch_ref: filter_scope=window_branch 时必填，用证据中的窗口名称（如“7d窗口”）指明分支；source_level 时填 null。
      completion_conditions:
        - 每个谓词的字段、操作符、常量类型和值均明确。
        - 每个谓词的 filter_scope 已明确；window_branch 谓词均有 branch_ref。
        - SQL 三值逻辑下的 null_semantics 已明确。
      common_errors:
        - 把时间窗口重复写进事实过滤。
        - 把维度源的 is_active 等谓词写入事实过滤。
        - 把事实去重键或维度实体键的空值规则改写为事实资格谓词。
        - 把 source_ref 猜成某张未在证据出现的表。
        - 把“忽略得分为零/非零”改写成 gt/gte（gt 连负值一起排除；质量校验会据此把正确的 != 0 改写成 > 0）。
        - 把针对不同窗口变体字段的过滤合并成“同时满足”的全局过滤（丢失仅在部分窗口有非零数据的用户）。
        - window_branch 谓词未填写 branch_ref，或把 window_branch 谓词提升为整个事实源的全局过滤。
        - 把数值比较的 operand_type 写成 string。
    few_shots:
      - input: 事实源 app_tag_score；只保留 tag_score 非零的标签记录。
        output:
          field_id: fact_filters
          value:
            predicates:
              - source_ref: app_tag_score
                field_ref: tag_score
                operator: ne
                operand_type: number
                operands: ["0"]
                null_semantics: exclude_unknown
                filter_scope: source_level
                branch_ref: null
          unresolved: []
          rationale: 用户要求"非零"，按协议映射为 ne 且 operands=["0"]；无窗口分支概念，作用范围取 source_level。
      - input: 事实源 user_system_tag_score；分别按 7d/14d/30d 窗口生成系统标签序列，每个窗口忽略对应窗口兴趣得分为零的记录（7d 窗口只过滤 7d 得分，14d 窗口只过滤 14d 得分，30d 窗口只过滤 30d 得分）。
        output:
          field_id: fact_filters
          value:
            predicates:
              - source_ref: user_system_tag_score
                field_ref: user_app_interest_score_7d_sum_up
                operator: ne
                operand_type: number
                operands: ["0"]
                null_semantics: exclude_unknown
                filter_scope: window_branch
                branch_ref: "7d窗口"
              - source_ref: user_system_tag_score
                field_ref: user_app_interest_score_14d_sum_up
                operator: ne
                operand_type: number
                operands: ["0"]
                null_semantics: exclude_unknown
                filter_scope: window_branch
                branch_ref: "14d窗口"
              - source_ref: user_system_tag_score
                field_ref: user_app_interest_score_30d_sum_up
                operator: ne
                operand_type: number
                operands: ["0"]
                null_semantics: exclude_unknown
                filter_scope: window_branch
                branch_ref: "30d窗口"
          unresolved: []
          rationale: 每个窗口只过滤对应窗口得分，故按窗口变体字段分别记录 window_branch 谓词并标注 branch_ref，禁止合并为全局过滤。
      - input: 事实源 orders；只统计金额大于 0 的订单（用户明确“大于 0”），空值排除。
        output:
          field_id: fact_filters
          value:
            predicates:
              - source_ref: orders
                field_ref: amount
                operator: gt
                operand_type: number
                operands: ["0"]
                null_semantics: exclude_unknown
                filter_scope: source_level
                branch_ref: null
          unresolved: []
          rationale: 用户明确"大于 0"故用 gt；空值排除对应 exclude_unknown；无窗口分支，作用范围取 source_level。
      - input: 事实源 orders；只取 status in ('paid','completed')，status 为空时排除。
        output:
          field_id: fact_filters
          value:
            predicates:
              - source_ref: orders
                field_ref: status
                operator: in
                operand_type: string
                operands: [paid, completed]
                null_semantics: exclude_unknown
                filter_scope: source_level
                branch_ref: null
          unresolved: []
          rationale: 按用户给出的枚举值填 in 谓词，operand_type=string，空值排除；作用范围 source_level。
      - input: 证据只说“过滤无效订单”，没有有效状态定义。
        output:
          field_id: fact_filters
          value:
            predicates: []
          unresolved:
            - 无效订单缺少可执行的字段谓词定义
          question: 现有信息提到过滤无效订单，但没有说明对应字段、操作符和值；请补充可执行的过滤谓词。
          rationale: 证据只说"过滤无效订单"，没有字段/操作符/值定义，predicates 留空并记入 unresolved。
      - input: 用户只要求统计全部订单数量，没有提出事实记录过滤要求。
        output:
          field_id: fact_filters
          value:
            predicates: []
          rationale: 用户只要求统计全部订单数量，未提出事实过滤要求，predicates 为空。
      - input: 证据只说明事实去重键 business_id 为空时拒绝、维度表 is_active=true，并出现 join 类型冲突；没有事实记录资格条件。
        output:
          field_id: fact_filters
          value:
            predicates: []
          rationale: 去重键空值规则与维度 is_active 过滤不构成事实记录资格谓词，predicates 为空。
    writable_template:
      field_id: fact_filters
      value:
        predicates:
          - source_ref: null
            field_ref: null
            operator: null
            operand_type: null
            operands: []
            null_semantics: null
            filter_scope: null
            branch_ref: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [predicates]
      properties:
        predicates:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_ref, field_ref, operator, operand_type, operands, null_semantics, filter_scope, branch_ref]
            properties:
              source_ref: {type: string, minLength: 1}
              field_ref: {type: string, minLength: 1}
              operator: {enum: [eq, ne, in, not_in, gt, gte, lt, lte, between, is_null, is_not_null]}
              operand_type: {enum: [string, number, boolean, date, datetime]}
              operands: {type: array, items: {type: string}}
              null_semantics: {enum: [exclude_unknown, include_unknown, conflict]}
              filter_scope: {enum: [source_level, window_branch, null]}
              branch_ref: {type: [string, "null"], minLength: 1}

  - field_id: fact_derived_fields
    title: 事实表字段转换
    purpose: 定义事实数据进入最终口径前必须得到的确定性派生字段。
    optional: true
    not_applicable_value:
      derived_fields: []
    field_instructions:
      global_rules:
        - 每个派生字段必须能由列出的 input_fields 和 expression 唯一计算，不得使用“清洗一下”等模糊描述。
        - 不记录执行顺序；若表达式依赖未提供的中间字段，写入 unresolved。
        - 仅填写 source_ref 被证据明确标注为事实源的转换；同一证据中的维度源转换属于 dimension_derived_fields，必须忽略。
        - 表达式中的类型转换必须与字段实际语义一致：得分、金额、比率等可能含小数的数值字符串字段必须使用 FLOAT/DOUBLE 转换，禁止 CAST 成 INT（INT 截断小数会导致过滤条件与排序全部失效）；只有证据明确该字段为整数时才允许 INT。
        - 使用带排序语义的 UDAF（如 ConcatWithRank 按第二参数升序拼接）时，必须按其文档语义传参；需要降序拼接时不得直接传原始得分字段，必须先用窗口函数生成排名（或取负值）再传入。
      subfields:
        derived_fields: 填 source_ref、target_field、input_fields、expression、output_type、unit、rounding、null_semantics。
        expression: 使用证据给出的确定公式或受控表达式，不得自行设计公式。
        rounding: 无舍入填 null；有舍入时写明确模式与位数，例如 half_up:2。
      completion_conditions:
        - 目标字段、全部输入字段、表达式、输出类型和空值语义完整。
      common_errors:
        - 根据字段名猜测单位换算。
        - 因为工具证据同时出现维度转换，就把维度派生字段写入事实派生字段。
        - 用自然语言替代可判定的表达式。
        - 把可能含小数的得分/金额字段 CAST 成 INT（截断后过滤与排序失效）。
        - 使用 ConcatWithRank 等带排序语义的 UDAF 时直接传原始得分字段作排序依据（升序与降序需求相反）。
    few_shots:
      - input: orders.amount_cent 除以 100 得到 amount_yuan，decimal(18,2)，不舍入；输入为空则输出为空。
        output:
          field_id: fact_derived_fields
          value:
            derived_fields:
              - source_ref: orders
                target_field: amount_yuan
                input_fields: [amount_cent]
                expression: amount_cent / 100
                output_type: decimal(18,2)
                unit: CNY_yuan
                rounding: null
                null_semantics: propagate_null
          unresolved: []
          rationale: 按转换要求填写输入字段、表达式、输出类型；不舍入及空输入输出为空对应 rounding=null 与 propagate_null。
      - input: 只说“把金额标准化”。
        output:
          field_id: fact_derived_fields
          value:
            derived_fields: []
          unresolved:
            - 金额标准化缺少输入字段、目标字段和确定公式
          question: 现有信息要求金额标准化，但没有说明输入字段、目标字段和确定公式；请补充这些转换口径。
          rationale: 只说"金额标准化"，缺少输入字段与确定公式，derived_fields 留空并记入 unresolved。
      - input: 用户直接使用事实源字段，没有提出任何字段转换要求。
        output:
          field_id: fact_derived_fields
          value:
            derived_fields: []
          rationale: 事实源字段直接使用，没有转换要求，derived_fields 为空。
      - input: 证据只说明 dim_user.name 需要 lower(trim(name))，事实源字段直接使用。
        output:
          field_id: fact_derived_fields
          value:
            derived_fields: []
          rationale: lower(trim(name)) 只作用于维度表 dim_user，不属于事实表转换，derived_fields 为空。
    writable_template:
      field_id: fact_derived_fields
      value:
        derived_fields:
          - source_ref: null
            target_field: null
            input_fields: []
            expression: null
            output_type: null
            unit: null
            rounding: null
            null_semantics: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [derived_fields]
      properties:
        derived_fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_ref, target_field, input_fields, expression, output_type, unit, rounding, null_semantics]
            properties:
              source_ref: {type: string, minLength: 1}
              target_field: {type: string, minLength: 1}
              input_fields: {type: array, minItems: 1, items: {type: string, minLength: 1}}
              expression: {type: string, minLength: 1}
              output_type: {type: string, minLength: 1}
              unit: {type: [string, "null"]}
              rounding: {type: [string, "null"]}
              null_semantics: {enum: [propagate_null, substitute_zero, reject_record, conflict]}

  - field_id: fact_deduplication
    title: 事实表去重规则
    purpose: 定义聚合口径中的同一事实记录等价类，以及每个等价类的唯一选择函数。
    optional: true
    not_applicable_value:
      record_identity:
        fields: []
        null_equality: null
      record_selection:
        criteria: []
        if_all_criteria_equal: null
    field_instructions:
      global_rules:
        - record_identity 只回答哪些记录属于同一业务事实；record_selection 只回答同组如何唯一选择。
        - 禁止填写 latest、earliest、prefer；必须用 choose=greatest/least 和明确字段、类型、空值排序。
        - record_selection 未确认时 criteria 必须为空且 if_all_criteria_equal 必须为 null，不得从 few-shot 或其他去重字段补默认平局行为。
        - 特征主键、统计时间、join 键、最终序列分区或排序字段都不自动构成事实记录身份；只有证据明确说明同一业务事实的判定方式时才适用本字段。
        - 用户未显式提出去重或重复记录需求时，record_identity.fields 必须为空数组：不要把"每个X""按X分组""按X分区""X的排名"等分区/分组语义推断为记录身份，也不得用通用建模知识补出身份字段。
        - 只有工具证据明确出现"同一记录""重复记录""同一实体""相同XX视为同一事实"等重复语义时才填写 record_identity.fields，并同时给出对应证据来源。
      subfields:
        record_identity.fields: 构成同一事实记录等价类的全部字段。
        record_identity.null_equality: 明确空值是否相等、区分、拒绝或视为冲突。
        record_selection.criteria: 按优先级列出字段、choose、value_type、null_rank。
        record_selection.if_all_criteria_equal: 所有条件相同时的唯一行为。
      completion_conditions:
        - 身份等价关系和选择函数均完整；需要唯一输出时不得留下未决平局。
      common_errors:
        - 只写“按更新时间取最新”。
        - 把最终序列去重规则写到这里。
    few_shots:
      - input: orders 中相同 order_id、line_id 是同一事实；先取 updated_at 最大，再取 ingestion_id 最大；空值最低；仍相同则冲突。
        output:
          field_id: fact_deduplication
          value:
            record_identity:
              fields: [order_id, line_id]
              null_equality: reject_record
            record_selection:
              criteria:
                - field_ref: updated_at
                  choose: greatest
                  value_type: datetime
                  null_rank: lowest
                - field_ref: ingestion_id
                  choose: greatest
                  value_type: number
                  null_rank: lowest
              if_all_criteria_equal: conflict
          unresolved: []
          rationale: 按证据填写 identity 字段与两级选择标准（updated_at 优先、ingestion_id 次级），空值最低且平局冲突。
      - input: 相同 order_id 要去重，只说“保留最新记录”。
        output:
          field_id: fact_deduplication
          value:
            record_identity:
              fields: [order_id]
              null_equality: null
            record_selection:
              criteria: []
              if_all_criteria_equal: null
          unresolved:
            - 最新记录缺少比较字段、类型、空值排序和平局行为
            - order_id 为空时的身份等价关系未说明
          question: 现有信息要求按 order_id 保留最新记录，但没有说清比较字段、类型、空值排序、平局行为及空 order_id 的处理；请补充这些规则。
          rationale: 只有 identity 字段有证据；比较字段、类型、空值排序与平局行为未说明，selection 留空并记入 unresolved。
      - input: 用户没有提出事实记录去重要求，证据也没有说明事实源存在重复记录。
        output:
          field_id: fact_deduplication
          value:
            record_identity:
              fields: []
              null_equality: null
            record_selection:
              criteria: []
              if_all_criteria_equal: null
          rationale: 用户与证据均未提出去重要求，identity 与 selection 均保持空。
      - input: 证据给出了 feature_key、统计时间、join 键和最终序列排序；还说明 dim_user 按 version_no 选版本、最终重复时按 score 取一条；没有说明哪些事实记录属于同一业务事实。
        output:
          field_id: fact_deduplication
          value:
            record_identity:
              fields: []
              null_equality: null
            record_selection:
              criteria: []
              if_all_criteria_equal: null
          rationale: 证据只给 feature_key/统计时间/join 键等，未说明哪些事实记录属于同一业务事实，保持空。
    writable_template:
      field_id: fact_deduplication
      value:
        record_identity:
          fields: []
          null_equality: null
        record_selection:
          criteria:
            - field_ref: null
              choose: null
              value_type: null
              null_rank: null
          if_all_criteria_equal: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [record_identity, record_selection]
      properties:
        record_identity:
          type: object
          additionalProperties: false
          required: [fields, null_equality]
          properties:
            fields: {type: array, items: {type: string, minLength: 1}}
            null_equality: {enum: [nulls_equal, nulls_distinct, reject_record, conflict, null]}
        record_selection:
          type: object
          additionalProperties: false
          required: [criteria, if_all_criteria_equal]
          properties:
            criteria:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [field_ref, choose, value_type, null_rank]
                properties:
                  field_ref: {type: string, minLength: 1}
                  choose: {enum: [greatest, least]}
                  value_type: {enum: [string, number, date, datetime, boolean]}
                  null_rank: {enum: [lowest, highest, reject_record, conflict]}
            if_all_criteria_equal: {enum: [conflict, retain_all, records_are_equivalent, null]}

  - field_id: dimension_filters
    title: 维度表过滤条件
    purpose: 分维度源定义可参与关联的维度记录资格谓词。
    optional: true
    not_applicable_value:
      scopes: []
    field_instructions:
      global_rules:
        - 每个 source_ref 独立成一个 scope；不得把事实表过滤或 join 条件写进来。
        - 条件协议与 fact_filters 相同，常量必须有类型，空值语义必须明确；每个谓词同样标注 filter_scope（维度源按窗口分支过滤时用 window_branch 并填 branch_ref）。
        - 只有工具证据明确出现维度源（被标注为维度/维表，或与事实源存在关联关系）时才填写本字段；任务不涉及维度表时 scopes 必须为空数组，禁止按通用建模知识发明维度源。
      subfields:
        scopes: 每项包含 source_ref 和该维度源的 predicates。
      completion_conditions:
        - 所有被明确提及的维度源和过滤谓词均被覆盖。
      common_errors:
        - 合并不同维度表的同名字段条件。
        - 根据“有效维度”自行猜测状态值。
        - 任务无维度表时仍发明维度过滤；把最终序列排序/截断规则误写成维度过滤。
    few_shots:
      - input: dim_store 只保留 is_active=true；空值排除。
        output:
          field_id: dimension_filters
          value:
            scopes:
              - source_ref: dim_store
                predicates:
                  - field_ref: is_active
                    operator: eq
                    operand_type: boolean
                    operands: ["true"]
                    null_semantics: exclude_unknown
                    filter_scope: source_level
                    branch_ref: null
          unresolved: []
          rationale: 按维度过滤要求填 eq 谓词、operand_type=boolean 与空值排除；无窗口分支，作用范围 source_level。
      - input: 没有给出任何维度过滤要求。
        output:
          field_id: dimension_filters
          value:
            scopes: []
          unresolved: []
          rationale: 未给出任何维度过滤要求，scopes 为空。
    writable_template:
      field_id: dimension_filters
      value:
        scopes:
          - source_ref: null
            predicates:
              - field_ref: null
                operator: null
                operand_type: null
                operands: []
                null_semantics: null
                filter_scope: null
                branch_ref: null
      unresolved: []
    value_schema:
      type: object
      additionalProperties: false
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [source_ref, predicates]
            properties:
              source_ref: {type: string, minLength: 1}
              predicates:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [field_ref, operator, operand_type, operands, null_semantics, filter_scope, branch_ref]
                  properties:
                    field_ref: {type: string, minLength: 1}
                    operator: {enum: [eq, ne, in, not_in, gt, gte, lt, lte, between, is_null, is_not_null]}
                    operand_type: {enum: [string, number, boolean, date, datetime]}
                    operands: {type: array, items: {type: string}}
                    null_semantics: {enum: [exclude_unknown, include_unknown, conflict]}
                    filter_scope: {enum: [source_level, window_branch, null]}
                    branch_ref: {type: [string, "null"], minLength: 1}

