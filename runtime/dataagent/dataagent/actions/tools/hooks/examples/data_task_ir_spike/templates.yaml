# DataTaskIR template catalog v1.0.0
# Six field units: identity, sources, time_context, output_features, pipeline, sequence.
template_id: data_task_ir
template_version: 1.0.0
language: zh-CN
contract:
- 每个 field unit 独立调用模型；只能修改当前 writable_template 中出现的字段。
- 输出必须是单个 JSON 对象；field_id、value、rationale 必填；unresolved/question 按需。
- null 表示证据不足，不表示沿用旧值；数组无项时填空数组。
- 整个字段或任意子字段均允许信息不完备；required 只描述键结构，不要求猜测业务值。缺少的键可由程序补为 null。
- completion_conditions 仅描述信息齐备状态，不是必须填满的要求；只提取已有证据，不为满足齐备条件而发明口径。
- 未涉及的操作不新增、不强制追问；只有影响当前任务正确实现的缺失或冲突才写 unresolved/question。
- 禁止把“通常/默认/建议/prefer”写成已确认口径。
- 冲突时受影响槽位保持 null/空数组，并写 unresolved，禁止选边。
- few-shot 只演示协议，禁止复制业务值。
- 禁止在多个 field unit 中重复填写同一口径；若某信息已有权威位置，其他字段只引用。
output_contract:
  field_id: 必填；固定为当前 Field Unit 的 field_id。
  value: 必填；结构遵循 writable_template。
  rationale: 必填。
  unresolved: 可选字符串数组。
  question: unresolved 非空时必填。
predicate_protocol:
  shape_keys:
  - source_ref
  - field_ref
  - operator
  - operand_type
  - operands
  - null_semantics
  - filter_scope
  - branch_ref
  operator_enum:
  - eq
  - ne
  - in
  - not_in
  - gt
  - gte
  - lt
  - lte
  - between
  - is_null
  - is_not_null
  - not
  - null
  mapping_rules_inherited:
  - “非零/不等于零/忽略为零” → operator=ne, operands=["0"]；禁止写成 gt
  - “非空” → operator=not, operands=["bicoredata.IsEmpty(xxx)"]（或与现网等价写法）
  - operands 一律用字符串保存；between 恰好两个值；is_null/is_not_null 用 []
  required_always:
  - field_ref
  - operator
  optional_fields:
  - source_ref
  - operand_type
  - operands
  - null_semantics
  - filter_scope
  - branch_ref
  conditional_required:
  - when: operator 需要常量（eq/ne/in/gt/...）且证据已给出常量
    require:
    - operands
  - when: filter_scope == window_branch 且当前 feature/context 没有可用 window_ref
    require:
    - branch_ref
  - when: filter_scope == window_branch 且已有 window_ref
    require: []
    note: branch_ref 可省略，默认等于 window_ref
  defaults:
    source_ref:
      in_sources_facts_or_dimensions: 省略则使用外层 source_ref
      in_output_features_filters: 省略则尝试 feature.source；仍不明则 null，不编造
    filter_scope:
      in_sources_filters: 省略则默认 source_level
      in_output_features_filters_with_window_ref: 省略则视为该 window_ref 分支过滤（等价 window_branch）
      in_output_features_filters_without_window_ref: 省略则默认 source_level；无法判定则 null + unresolved
    branch_ref:
      when_window_ref_present: 可省略（= window_ref）
      when_filter_scope_window_branch_without_window_ref: 必填
      otherwise: null
    operand_type: 证据不足时保持 null，禁止猜测 string/number
    null_semantics: 证据不足时保持 null
    operands: operator 为 is_null/is_not_null 时用 []；其他缺证据时 null 或省略并 unresolved
  forbidden:
  - 不得新增 shape_keys 以外的键（additionalProperties=false）
  - 不得为“填满可选字段”而 invent operand_type / null_semantics / branch_ref
  - 不得把列级过滤提升写进 sources.facts[].filters（或反向把共享过滤抄进每个 feature）
fields:
- field_id: identity
  title: 特征主键
  purpose: 定义最终特征记录的逻辑主键；已确认组件是最终输出的必选前缀列。
  field_instructions:
    global_rules:
    - 只填最终逻辑主键，不得把源表物理主键、去重键、join 键自动当成特征主键。
    - 已确认 components 必须作为 INSERT SELECT 前缀列输出；不要为了“能输出”而抄到 output_features。
    - 冲突且无优先级时 components 置空并 unresolved。
    subfields:
      components: 联合键顺序的 field_ref / semantic_role / null_semantics
      uniqueness_scope: final_dataset | within_statistic_period | within_sequence_partition
    completion_conditions:
    - 有主键证据时提取 components；null_semantics/uniqueness_scope 无证据时留空，不为确认主键强制补齐这些子字段
    common_errors:
    - 因主键未出现在用户输出列表而省略
    - 把明细行 id 当作用户/设备特征主键
  few_shots:
  - input: 每个设备一条特征；device_id 不允许为空
    output:
      field_id: identity
      value:
        components:
        - field_ref: device_id
          semantic_role: 设备
          null_semantics: reject_record
        uniqueness_scope: final_dataset
      unresolved: []
      rationale: 用户要求设备级特征，证据说明 device_id 非空，故为主键。
  writable_template:
    field_id: identity
    value:
      components:
      - field_ref: null
        semantic_role: null
        null_semantics: null
      uniqueness_scope: null
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - components
    - uniqueness_scope
    properties:
      components:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - field_ref
          - semantic_role
          - null_semantics
          properties:
            field_ref:
              type: string
              minLength: 1
            semantic_role:
              type: string
              minLength: 1
            null_semantics:
              enum:
              - nulls_equal
              - nulls_distinct
              - reject_record
              - conflict
              - null
      uniqueness_scope:
        enum:
        - final_dataset
        - within_statistic_period
        - within_sequence_partition
        - null
- field_id: sources
  title: 数据源与关联预处理
  purpose: 定义事实/维度源的共享过滤、派生、去重，以及 JOIN 关系与扇出语义。
  field_instructions:
    global_rules:
    - 只填写对多列共享的预处理与关联；某一输出列私有的过滤/窗口写到 output_features.filters。
    - filters[] 使用共用 predicate_protocol：保留 0.8.0 谓词键集合，仅 field_ref、operator 必填，其余可选；缺省规则见文件顶部 predicate_protocol.defaults。
    - 在 facts[i]/dimensions[i] 内写过滤时，谓词可省略 source_ref（默认外层 source_ref）。
    - 维表关联键不唯一时 cardinality 必须标 one_to_many / many_to_many，不得掩盖扇出。
    - 事实层 dedup 作用于 JOIN 前事实行；是否先去重再 JOIN 由 pipeline.deduplication_before_join 决定。
    - 无维度关联时 dimensions 填空数组。
    subfields:
      facts: 事实源列表（source_ref/filters/derived/dedup）
      dimensions: 维度源列表（source_ref/filters/derived/dedup/join）
    completion_conditions:
    - 任务涉及的事实源均已列出；有 JOIN 时 join 条件与 cardinality 明确
    - 每个共享过滤谓词至少有 field_ref 与 operator；有常量证据时 operands 已填
    common_errors:
    - 把列级指标过滤写进 facts.filters，污染其他指标
    - 有扇出却标 many_to_one
    - 为填满可选字段而编造 operand_type / null_semantics
  few_shots:
  - input: 事实表 evt 需 event_type=download；维表 dim_cat 按 category_id LEFT JOIN，一类目多行
    output:
      field_id: sources
      value:
        facts:
        - source_ref: evt
          filters:
          - field_ref: event_type
            operator: eq
            operands:
            - download
          derived: []
          dedup: null
        dimensions:
        - source_ref: dim_cat
          filters: []
          derived: []
          dedup: null
          join:
            fact_source_ref: evt
            join_type: left
            conditions:
            - fact_field: category_id
              dim_field: category_id
            cardinality: one_to_many
            unmatched_fact: keep
      unresolved: []
      rationale: 共享下载事件过滤放 facts；谓词只填有证据的键；维表一对多如实记录。
  writable_template:
    field_id: sources
    value:
      facts:
      - source_ref: null
        filters: []
        derived: []
        dedup: null
      dimensions: []
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - facts
    - dimensions
    properties:
      facts:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - source_ref
          - filters
          - derived
          - dedup
          properties:
            source_ref:
              type: string
              minLength: 1
            filters:
              type: array
              items: &id001
                type: object
                additionalProperties: false
                required:
                - field_ref
                - operator
                properties:
                  source_ref:
                    type:
                    - string
                    - 'null'
                  field_ref:
                    type: string
                    minLength: 1
                  operator:
                    enum:
                    - eq
                    - ne
                    - in
                    - not_in
                    - gt
                    - gte
                    - lt
                    - lte
                    - between
                    - is_null
                    - is_not_null
                    - not
                    - null
                  operand_type:
                    enum:
                    - string
                    - number
                    - boolean
                    - null
                  operands:
                    type:
                    - array
                    - 'null'
                    items:
                      type: string
                  null_semantics:
                    enum:
                    - nulls_equal
                    - nulls_distinct
                    - reject_record
                    - conflict
                    - null
                  filter_scope:
                    enum:
                    - source_level
                    - window_branch
                    - null
                  branch_ref:
                    type:
                    - string
                    - 'null'
            derived:
              type: array
            dedup:
              type:
              - object
              - 'null'
              properties:
                record_identity:
                  type: object
                record_selection:
                  type: object
      dimensions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - source_ref
          - filters
          - derived
          - dedup
          - join
          properties:
            source_ref:
              type: string
              minLength: 1
            filters:
              type: array
              items: *id001
            derived:
              type: array
            dedup:
              type:
              - object
              - 'null'
            join:
              type: object
              required:
              - fact_source_ref
              - join_type
              - conditions
              - cardinality
              properties:
                fact_source_ref:
                  type: string
                join_type:
                  enum:
                  - left
                  - inner
                  - null
                conditions:
                  type: array
                cardinality:
                  enum:
                  - one_to_one
                  - one_to_many
                  - many_to_one
                  - many_to_many
                  - null
                unmatched_fact:
                  enum:
                  - keep
                  - drop
                  - null
                temporal_validity:
                  type:
                  - object
                  - 'null'
- field_id: time_context
  title: 时间上下文
  purpose: 同时定义输出统计分桶与输入回看窗口，避免二者混写。
  field_instructions:
    global_rules:
    - output_bucket 回答“每条输出属于哪个时间桶”；input_windows 回答“取哪些历史事实”。
    - “近 N 天”属于 input_windows，禁止写入 output_bucket.grain。
    - 多窗口任务在 input_windows 中命名各窗口（如 w7d/w30d），供 output_features.window_ref 引用。
    - 无统计分桶时 output_bucket.grain=none；无回看窗口时 input_windows=[]。
    subfields:
      output_bucket: time_field/grain/timezone/calendar/week_start/custom_definition
      input_windows: 命名窗口列表（window_id/time_field/anchor/range/boundary）
    completion_conditions:
    - 涉及时间时 output_bucket 或 input_windows 至少一侧有证据且二者不混用
    common_errors:
    - 把近30天写成 grain=day
    - 多窗口不命名导致 features 无法引用
  few_shots:
  - input: 按天输出；计算近7天与近30天下载
    output:
      field_id: time_context
      value:
        output_bucket:
          time_field: pt_d
          grain: day
          timezone: Asia/Shanghai
          calendar: gregorian
          week_start: null
          custom_definition: null
        input_windows:
        - window_id: w7d
          time_field: event_time
          anchor: current_partition
          range:
            type: duration
            direction: past
            number: 7
            unit: day
            include_anchor_period: true
          boundary: half_open_right
        - window_id: w30d
          time_field: event_time
          anchor: current_partition
          range:
            type: duration
            direction: past
            number: 30
            unit: day
            include_anchor_period: true
          boundary: half_open_right
      unresolved: []
      rationale: 输出按 pt_d 日桶；两个回看窗口分别命名供特征引用。
  writable_template:
    field_id: time_context
    value:
      output_bucket:
        time_field: null
        grain: null
        timezone: null
        calendar: null
        week_start: null
        custom_definition: null
      input_windows: []
    unresolved: []
  value_schema:
    type: object
    additionalProperties: false
    required:
    - output_bucket
    - input_windows
    properties:
      output_bucket:
        type: object
        required:
        - time_field
        - grain
        - timezone
        - calendar
        - week_start
        - custom_definition
        properties:
          time_field:
            type:
            - string
            - 'null'
          grain:
            enum:
            - none
            - day
            - week
            - month
            - quarter
            - year
            - custom
            - null
          timezone:
            type:
            - string
            - 'null'
          calendar:
            type:
            - string
            - 'null'
          week_start:
            type:
            - string
            - 'null'
          custom_definition:
            type:
            - string
            - 'null'
      input_windows:
        type: array
        items:
          type: object
          required:
          - window_id
          - time_field
          - anchor
          - range
          - boundary
          properties:
            window_id:
              type: string
              minLength: 1
            time_field:
              type:
              - string
              - 'null'
            anchor:
              type:
              - string
              - 'null'
            range:
              type:
              - object
              - 'null'
            boundary:
              type:
              - string
              - 'null'
- field_id: output_features
  title: 输出特征目录
  purpose: '定义除主键前缀外的全部输出列口径。多维交叉（如多窗口×多指标）以 axes+measures 紧凑描述，由代码确定性展开；独立列用 layout=flat 的 features[]，或
    cartesian 下的 extras[]。

    '
  field_instructions:
    global_rules:
    - layout 二选一权威：cartesian（默认用于窗口×指标等可因子化交叉）或 flat（列彼此独立）。
    - layout=cartesian 时：只填 axes + measures（+ 可选 overrides/extras）；禁止手写完整交叉列清单。
    - axes[].values 对 window 轴必须引用 time_context.input_windows.window_id；禁止在 measure 内重复定义窗口。
    - measures[] 写指标模板一次（calc/aggregation/filters/attach_rank/name_pattern）；所有轴组合继承该模板。
    - 展开列名由 name_pattern 确定性生成（默认 "{measure_id}_{window}"）；render 用同一规则展开供主 Agent 对照。
      展开列名不是 SQL/DDL 强制约束，下游可按规范另命名，不得因未照抄同名判失败。
    - 期望业务列数 = ∏|axis.values|（每个 measure 一列）；若 measure.attach_rank 非 null， 再为每个轴组合追加 1 个 rank 列（name_pattern
      默认 "{measure_id}_{window}_pct"）， 禁止对跨窗口汇总值打一个分位替代分窗口分位。
    - overrides 仅用于极少数格子与模板不同；不得用 overrides 穷举笛卡尔积。
    - extras[]：不参与交叉的独立列（多阶段 Top1、全局比率、key_alias 等）。
    - layout=flat 时：使用 features[] 逐列描述（同旧 features 语义）；axes/measures 必须为空。
    - calc.intent 语义级，禁止可执行 SQL；aggregation.grain 为该 measure/列的粒度权威（[]=已确认全局聚合；null/未填写本身不确认粒度或是否聚合）。
    - 不同 measure 允许不同 grain；禁止用单一全局粒度覆盖。
    - 列私有过滤放 measure.filters / feature.filters；共享过滤放 sources。
    - filters 使用 predicate_protocol；有 window 轴时展开列自动绑定对应 window_ref。
    - based_on/depends_on 在模板层引用 measure_id 或 extras.field_name；展开后映射到具体列名。
    - TopN 截断写 sequence.truncation，不写本字段。
    - identity 主键列不要抄进 measures/features（除非 role=key_alias）。
    subfields:
      layout: cartesian | flat
      axes: 交叉轴（cartesian）
      measures: 指标模板（cartesian）
      overrides: 稀疏格子覆盖（cartesian）
      extras: 非交叉独立列（cartesian）
      features: 逐列清单（flat）
    completion_conditions:
    - cartesian：axes/measures 完整，窗口 id 可解析，name_pattern 可展开且无冲突
    - flat：features 覆盖全部独立输出列
    - 聚合 measure 的 grain 与 count 语义明确；需要百分位时 attach_rank 已填
    common_errors:
    - 5×3 交叉却逐列写 15 行 features（重复口径）
    - 把近 N 天写进 grain
    - invent SQL 到 calc.intent
    - 用跨窗口汇总值打一个全局百分位替代分窗口百分位
    - cartesian 与 flat 混用且两边都填满造成双权威
  expansion_spec:
    description: render/verify 使用的确定性展开（非 LLM）
    algorithm: "if layout == flat:\n  columns = features\nelse:  # cartesian\n  columns = []\n  for each\
      \ tuple t in cartesian_product(axes[i].values):\n    binding = {axes[i].axis_id: t[i]}\n    for\
      \ each measure m in measures:\n      col = apply(m, binding)  # window_ref=binding.window if any\n\
      \      col.field_name = format(m.name_pattern or \"{measure_id}_{window}\", binding, m)\n      apply\
      \ matching override patch if any\n      columns.append(col)\n      if m.attach_rank:\n        rank_col\
      \ = derive_rank_column(col, m.attach_rank)\n        rank_col.field_name = format(m.attach_rank.name_pattern\
      \ or \"{measure_id}_{window}_pct\", ...)\n        columns.append(rank_col)\n  columns += extras\n\
      output_columns = identity.components + columns\n"
  few_shots:
  - input: 主键 device_id；近7/30天下载次数与付费金额（2×2=4）；均按 device_id 聚合
    output:
      field_id: output_features
      value:
        layout: cartesian
        axes:
        - axis_id: window
          values:
          - w7d
          - w30d
        measures:
        - measure_id: download_cnt
          role: metric
          output_type: bigint
          description: 下载次数
          source: evt.app_id
          calc:
            intent: 下载事件行计数
            "on": app_id
          aggregation:
            grain:
            - device_id
            count_type: row_count
            count_entity: record_row
            distinct_field: null
            expression_template: null
          filters: []
          name_pattern: '{measure_id}_{window}'
          attach_rank: null
          ratio: null
          depends_on: []
        - measure_id: pay_amt
          role: metric
          output_type: decimal(18,2)
          description: 付费金额
          source: evt.amount
          calc:
            intent: 付费金额求和
            "on": amount
          aggregation:
            grain:
            - device_id
            count_type: null
            count_entity: null
            distinct_field: null
            expression_template: null
          filters: []
          name_pattern: '{measure_id}_{window}'
          attach_rank: null
          ratio: null
          depends_on: []
        overrides: []
        extras: []
        features: []
      unresolved: []
      rationale: 只描述 2 窗口×2 指标模板；展开后 4 列由代码生成，不逐列抄写。
  - input: 近7/30天下载次数，且各窗口下载次数各打全球 NTILE(100)
    output:
      field_id: output_features
      value:
        layout: cartesian
        axes:
        - axis_id: window
          values:
          - w7d
          - w30d
        measures:
        - measure_id: download_cnt
          role: metric
          output_type: bigint
          description: 下载次数
          source: evt.app_id
          calc:
            intent: 下载事件行计数
            "on": app_id
          aggregation:
            grain:
            - device_id
            count_type: row_count
            count_entity: record_row
            distinct_field: null
            expression_template: null
          filters: []
          name_pattern: '{measure_id}_{window}'
          attach_rank:
            rank_type: ntile
            bucket_count: 100
            order_direction: desc
            partition_by: []
            name_pattern: '{measure_id}_{window}_pct'
          ratio: null
          depends_on: []
        overrides: []
