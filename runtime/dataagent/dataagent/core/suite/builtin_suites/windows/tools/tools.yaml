# =============================================================================
# tools/tools.yaml — Windows Suite 工具定义
# =============================================================================

TOOLS:
  local_functions:
    - module: "dataagent.core.suite.builtin_suites.windows.tools.cmd_tool"
      function: "win_cmd"
      name: "windows_cmd"
      description: "Execute a Windows cmd.exe command in the current workspace"

    - module: "dataagent.core.suite.builtin_suites.windows.tools.grep_tool"
      function: "win_grep"
      name: "windows_grep"
      description: "Pure-Python content search tool for Windows (replaces system grep)"
