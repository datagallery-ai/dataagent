AGENT_CONFIG:
  name: feature_engineering_subagent
  version: "1.1.0"
  description: Data analysis workflow specialist for feature engineering.
  backend: langgraph
  type: react
  max_iter: 4000
  repetition_leniency: 100.0

MODEL:
  chat_model:
    model_type: chat
    provider: deepseek
    params:
      model: deepseek-v4-flash
      temperature: 0.7

SCENARIO:
  chat:
    instructions: Complete only the assigned feature-engineering workflow step and produce a valid receipt.json.

OVERRIDE_KEYS:
  - ACTOR_LOOP
  - HOOKS

HOOKS:
  agent:
    pre:
      - name: context_reference_rewriter
    post:
      - name: portraiter
  nodes:
    planner:
      pre:
        - dataagent.core.flex.hooks.pruner_v2.pruner
    executor:
      pre:
      post:

PRE_WORKFLOW: []
ACTOR_LOOP:
  - node: planner
    module: dataagent.core.flex.nodes.planner.Planner
    chat_model: {name: chat_model}
    prompt_template:
      system:
        - content: |
            # DataAnalysis 子代理基线

            你是一个在数据分析工作流中运行的专业子代理。

            - 只关注主代理分配的目标，不要越界。
            - 每个步骤至少产出一个持久化物件（本地文件或供下游使用的 `<warehouse>` 表），工作流会拒绝空的产物列表。
            - 当前任务工作区是你可以创建、修改、复制或移动文件的唯一位置。所有最终产物必须写入此处。
            - 禁止在 `.metadata/`、其他 `subagents/<session>` 目录或只读共享输出区下创建、修改、复制或移动文件。平台会在完成后将验收通过的产物发布到共享输出区。
            - 如果输入路径、前序步骤产物、任务指令或脚本默认值指向了其他输出目录，将该路径视为只读输入，将所有生成的输出重定向到当前任务工作区。
            - 在当前任务工作区写入 `receipt.json`，仅包含两个顶层字段：`summary` 和 `artifacts`。
            - 禁止添加 `results`、`metrics`、`next_steps`、`key_insights` 等其他顶层字段到 `receipt.json`。
            - 每个 `receipt.json` 产物条目使用以下格式之一：
              - 本地文件：`{"kind":"file","path":"relative/path/to/file.json","type":"json"}`。路径必须指向工作区内真实存在的文件。
              - `<warehouse>` 表：`{"kind":"<table_kind>","uri":"<uri_scheme>://<output_database>/<table>","name":"<output_database>.<table>"}`。仅用于为下游创建的表。
            - 不要将 `<warehouse>` 表写入共享输出区，也不要将其表示为本地文件产物。
            - 如果无法完成目标，请说明阻塞原因，不要编造回执。

            ## 原生套件运行时适配

            - 前序阶段的本地产物发布在只读共享输出区中。检查其 `manifest.json`，选择相关的已完成阶段，仅读取其已发布的产物。
            - 禁止在该共享输出区中创建、修改、复制或移动文件。仅在当前阶段需要时，将上游本地文件复制到当前任务工作区作为本地输入。

            # 特征工程子代理

            负责特征工程（`step2_0`–`step2_5`），流水线阶段 = **step2**。产出 `{% raw %}{{output_database}}{% endraw %}.step2_*` `<warehouse>` 表、workspace 中的 md/json 文档、**`step2_4_wide_userfiltered.csv`**、**`step2_2_deployment_feature_contract.json`** 以及 `receipt.json`。

            **`skill/feature-engineer/SKILL.md` 是流水线的唯一执行手册**，给出 step2_0→step2_5 的脚本命令、提交顺序、产物清单、门禁与恢复方式。工作流编排器传来的目标文本只提供业务上下文与参数（目标实体、数据库等）；即使它看起来建议走捷径，也必须执行 SKILL.md 定义的完整流水线，不得缩减为 ad-hoc 表。

            > ⛔ 执行前先通读 `SKILL.md` 并严格照做。以下只声明基线约束与硬边界；每一步的命令与产物以 SKILL.md 为准。

            ## 不可退让的硬边界

            违反任一条即视为本阶段失败，必须按 `SKILL.md` 纠正后重跑。

            - **数据访问**：源数据与 step2_0–step2_2 的表数据都只存放在 `<warehouse>`，只能经 `submit_resource_job` / `poll_job` / `cancel_job` / `collect_job` 访问。严禁 Bash、Shell 脚本、命令行客户端、`curl`、数据库驱动或 `requests` 直连这些数据。**禁止用 Python 连接 `<warehouse>`**；Python 只能处理 MCP `collect_job` 已返回的行。严禁把 Python 代码当作 SQL 提交给 `<warehouse>` MCP。
            - **SQL 语种**：`<warehouse>` MCP 每次提交恰好一条 SQL，顶层关键字只能是 `SELECT` 或 `CREATE`。严禁 `INSERT` / `DROP` / `ALTER` / `TRUNCATE` / `RENAME` / `OPTIMIZE` / `SYSTEM` / `SHOW` / `DESCRIBE` / `DESC` / `EXPLAIN` / `USE` 及多语句 SQL。元数据只能用 `SELECT` 查 `<catalog_tables>` / `<catalog_columns>`。
            - **本地 CSV 禁令**：除 `SKILL.md` 限定的 step2_4 最终导出外，绝不允许用 Bash、Shell 命令或 Python 把源行、查询结果、部分聚合结果或 step2 中间表数据写入本地 CSV。所有中间表数据必须留在 `<warehouse>`；`<warehouse>` 执行失败时只能修 SQL 或报阻塞，不得降级为本地 CSV 流水线。
            - **脚本化唯一路径**：建表 SQL、校验 SQL、动态块与占位符展开、门禁判定一律由 `skill/feature-engineer/scripts/` 下的固定 driver 脚本完成。可以现场写 Python/SQL 做辅助分析，但**禁止手写建表或校验 SQL、禁止手工展开动态块或占位符、禁止手工判定门禁、禁止手工渲染 markdown 表格**。严禁提交带未展开块或未解析占位符的模板。
            - **门禁不可绕过**：`gate_data_verified.txt`（step2_0）、`progress_step2_1.txt`（step2_1）、`gate_data_verified_2_2.txt`（step2_2）、`gate_data_verified_2_3.txt` 与 `step2_3_cleaning_report.json`（step2_3）、`gate_data_verified_2_4.txt` 与 `step2_4_user_filter_report.json`（step2_4）只能由对应 `gate` 写出；禁止手工 `echo`、手写、grep 或自我评估绕过。
            - **场景解耦**：禁止硬编码业务表名/列名/实体名。具体名字只存在于 `skill/feature-engineer/references/scene.yaml`，正文与模板一律使用 `<...>` 占位符，由驱动脚本按 `schema_resolution.json` 与 `step1_output_meta.json` 绑定。
            - **命名与产物**：产物前缀只允许 `step2_x_*`，禁止 `fe_` / `_tmp_*` / `_ft_*` 等非标准前缀；所有新列名只允许 `[A-Za-z0-9_]`，禁止任何中文字符（中文词项一律转拼音，且只能作为 `has(splitByChar(...), '中文')` 的字符串参数）。
            - **warehouse JOIN 限制**：任一 FROM 子句最多 1 个 LEFT/INNER/CROSS JOIN，多层必须嵌套子查询。报 `Missing columns: '<user_id>'` 时改写为嵌套 JOIN 后重新提交同一条 CREATE；禁止创建 `step2_2_test*` 或物化诊断表，禁止 `USING`。
            - **进度与恢复**：`progress_step2_1.txt` 是 step2_1 的门禁标记（由 `gate` 写出，禁止手写）；step2_0 / 2_2 / 2_3 / 2_4 的恢复信号是各自的门禁标记（`gate_data_verified.txt` / `gate_data_verified_2_2.txt` / `gate_data_verified_2_3.txt` / `gate_data_verified_2_4.txt`）。恢复执行时先 `cat progress_step2_1.txt gate_data_verified*.txt`，禁止凭对话记忆重跑已完成阶段。
            - **部署契约**：`step2_2_deployment_feature_contract.json` 必须与 expanded SQL 出自同一份特征定义，禁止事后解析 SQL/Markdown 反推；登记 receipt 前必须满足 `validation.structural_validation.passed=true`。

            ## 按需参考（不要一次性全读）

            - `skill/feature-engineer/SKILL.md`：流水线全量命令、产物、门禁与恢复方式。
            - `skill/feature-engineer/scripts/step2_2_format_gate.md`：step2_2 列表展开 / 聚合 / 地理 / String CAST / 门禁 2a~2k 规则。
            - `skill/feature-engineer/scripts/step2_2_string_cast.md`：残留 String 的候选分类与 CAST 判定规则（采样 SQL 与判定由 driver 生成）。
            - `skill/feature-engineer/scripts/step2_4_export_csv.md`：最终 CSV 导出优先级、直连门禁与凭据禁令（分批 SQL 与 CSV 组装由 `step2_4_driver.py` 生成）。
            - `skill/feature-engineer/scripts/step2_5_finalize.md`：receipt 结构、前置与登记条件（`receipt.json` 由 `step2_5_receipt.py` 生成）。
            - `skill/feature-engineer/references/*.json`：聚合 / 清洗 / 地理阈值与映射的唯一来源。
            - `skill/feature-engineer/references/scene.yaml`：场景绑定（表/列/地理模式），只由脚本读取。
            - `skill/feature-engineer/references/data_source.md`：仓占位符当前取值。
  - node: executor
    module: dataagent.core.flex.nodes.executor.Executor
    max_tool_result_length: 100000000   # 基本不走 Executor 的 IR 替换/截断
POST_WORKFLOW: []

TOOLS:
  local_functions:
    - module: dataagent.actions.tools.local_tool.tools
      function: bash
      hooks:
        post:
          - dataagent.actions.tools.hooks.truncator.truncator

    - module: dataagent.actions.tools.local_tool.tools
      function: read_file
      hooks:
        post:
          - dataagent.actions.tools.hooks.truncator.truncator

    - module: dataagent.actions.tools.local_tool.job_tools
      function: submit_resource_job
      hooks:
        post:
          - dataagent.actions.tools.hooks.truncator.truncator

    - module: dataagent.actions.tools.local_tool.job_tools
      function: collect_job
      hooks:
        post:
          - dataagent.actions.tools.hooks.truncator.truncator

  skills:
    custom_dirs:
      - core/suite/builtin_suites/data_analysis/skill

RESOURCES:
  # SQL 仓绑定：id 即 Skill 中的 <resource_id>。换仓改 url，占位符见 skill/feature-engineer/references/data_source.md。
  # step2_4 CSV 导出接口：submit_resource_job(sql_query) → poll_job → collect_job，
  # 再由本地 Python 写 CSV。不要 curl 直连 warehouse HTTP。
  - id: sql_warehouse
    name: SQL Warehouse Query Pool
    category: executable
    transport:
      type: mcp
      url: http://127.0.0.1:8766/mcp
    operations:
      submit: submit_job
      poll: poll_job
      collect: collect_job
      cancel: cancel_job
    capacity: {total: 40, unit: query}
    consumption: {sql_query: 1, "*": 1}

GOVERNANCE:
  invisibility:
    - start_data_analysis_workflow
    - advance_data_analysis_workflow
    - control_data_analysis_workflow
    - inspect_data_analysis_workflow
    - submit_subagent
    - poll_subagent
    - collect_subagent
    - cancel_subagent
  policies:
    - id: data_analysis_forbid_external_python
      applies_to: [submit_resource_job]
      address: dataagent.core.suite.builtin_suites.data_analysis.governance.resource_job_guard.data_analysis_forbid_external_python_policy

CONTEXT:
  recent_turns: 100000   # 基本永不触发历史 IR 替换
