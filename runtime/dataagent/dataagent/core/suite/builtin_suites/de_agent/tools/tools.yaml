    #   function: "nl2sql_sub_agent_tool"
    #   config:
    #     llm_model: "chat_model"
    # nl2sql（思路2）
    - name: "wrapped_nl2sql_sub_agent_tool"
      module: "dataagent.core.suite.builtin_suites.de_agent.tools.nl2sql"
      function: "wrapped_nl2sql_sub_agent_tool"
      config:
        llm_model: "chat_model"
        suite_name: "data_engineering"
    # 写文件
    - name: "write_file"
      module: "dataagent.core.suite.builtin_suites.de_agent.tools.write_file"
      function: "write_file"
