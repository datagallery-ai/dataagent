        post:
          - dataagent.actions.tools.hooks.examples.ddl_hooks.ddl_post
    # 表名格式校验 + 数据库名校验
    - name: "validate_table_name"
      module: "dataagent.core.suite.builtin_suites.de_agent.tools.check_table_existence"
      function: "validate_table_name"
    # 表存在性检查 + 获取 schema
    - name: "check_table_existence"
      module: "dataagent.core.suite.builtin_suites.de_agent.tools.check_table_existence"
      function: "check_table_existence"
    # 查询已有表的 DML（INSERT SQL）
    - name: "query_sql_process"
      module: "dataagent.actions.tools.semantic_tool.query_sql_process"
      function: "query_sql_process"
    # SQL校验
    - name: "validate_deliverables"
      module: "dataagent.core.suite.builtin_suites.de_agent.tools.verify"
      function: "validate_deliverables"