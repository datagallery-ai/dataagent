AGENT_CONFIG:
  name: "data_engineering_agent"
  version: "1.0"
  backend: "langgraph"
  type: "react"
  enable_human_feedback: false
  hitl_task_index_path: "评测集task.json的完整路径"
  hitl_auto_resolve: false
  debug: true
  word_roots:
    csv_path: ""
  hitl_budget: 8

# DataTaskIR 行为调参（需同时启用 create_ir + update_ir；缺省与代码内默认一致）
DATA_TASK_IR:
  # eager：todo 完成时立即刷新 IR；on_consume：延迟到 nl2sql 等消费者 pre-hook 再刷新
  refresh_policy: eager
  # fallback_without_ir：IR 刷新失败时降级为空约束继续；strict：失败则阻断消费者
  failure_policy: fallback_without_ir
  # warn：一致性问题写入诊断仍可消费；enforce：一致性未过则阻断
  consistency_policy: warn

  # ----- IR→HITL（未确认口径自动澄清）-----
  # 总开关。true：关键字段 unresolved+question 入队，可拦 wrapped_nl2sql / validate，
  #   并由 ir_question_guard 改写为 request_human_feedback。
  # false：不入队、不拦消费者、不改写提问（与引入 IR→HITL 前一致）；IR 仍 fill/渲染，
  #   未确认槽位照旧从约束中省略。独立于 AGENT_CONFIG.enable_human_feedback。
  enable_ir_hitl: true
  # 允许进入 HITL 队列并拦截消费者的字段白名单（须同时有 unresolved 与非空 question）。
  # 不在名单中的字段即使 unresolved 也只作诊断，不拦 nl2sql。
  # 可选值：identity / sources / time_context / output_features / pipeline / sequence
  hitl_blocking_fields:
    - identity          # 特征主键
    - sources           # 数据源与关联
    - time_context      # 时间窗口
    - output_features   # 输出特征/指标口径
  # 同一批 pending 问题（指纹）最多自动追问次数；达到后清队列，降级为 confirmed-only
  # 消费（get_ir_context 附加降级说明），避免反复 HITL 烧光预算仍无 SQL。
  hitl_max_same_fingerprint_asks: 2
  # 同一 field_id 最多自动追问次数（即使 fill 换了 question 文案导致指纹漂移）。
  # 达到后该字段不再入队；若 HITL 已答复而 fill 仍标 unresolved，同步立即清出该字段。
  hitl_max_same_field_asks: 2
  # ir_question_guard 将 planner 回合改写为 request_human_feedback 的最多次数；
  # 达到后不再改写，ensure_ir_ready 同步放行消费者（best-effort）。
  hitl_question_guard_max_fires: 2

SUITE:
  include:
    - data_engineering

MODEL:
  chat_model:
    model_type: "chat"
    provider: "bailian"
    params:
      model: "DeepSeek_V4_Flash_Client"
      temperature: 0.3
      timeout: 600


SCENARIO:
  chat:
    input: "data engineering request"
    task: "design and deliver production-ready feature SQL package: DDL + one INSERT + requirement table"
    instructions:
      - "遵循 3 阶段交互模式：Initial 阶段确认数据源表；Mid 阶段确认用户标识字段和时间窗口口径；Final 阶段确认输出 schema。不要在 Initial 阶段就问输出格式，也不要在 Final 阶段才问数据源。"
      - "收敛后提交优于反复试错：当元数据和用户确认已充分时，直接 submit SQL，不要反复 execute/validate 试错。连续 2 次 validate 失败后必须 HITL 而非继续重试。"
    human_feedback_conditions: # human_feedback_conditions 在 enable_human_feedback 配置为 true 时生效，建议在需要多轮 HITL 确认的场景中使用
      # ===== 存在关键业务口径歧义（关键项，中频触发）=====
      # 覆盖各阶段（需求理解 → 数据源选择 → 数据处理 → 指标计算 → 方案权衡 → 最终证据确认）
      - "需求存在歧义或多种合理解读（如目标粒度、指标口径不明确）时，需由用户澄清"
      - "缺少关键业务信息（业务含义、筛选条件、时间窗口等）且无法从数据中推断时，需向用户确认"
      - "若源表选择依赖业务知识而非元数据证据时，需向用户确认数据来源表"
      - "若存在多个候选源表且元数据无法确定最优选择时，需在调用 wrapped_nl2sql_sub_agent_tool 工具前向用户确认所选源表"
      - "源表数据存在异常（如关键字段大面积为空、数据分布不合理）且无法推断处理策略时，需由用户决定处理策略"
      - "主键/JOIN key 字段空值处理策略存在歧义（过滤/保留影响行数）时，需向用户确认"
      - "分区策略（天/小时/分钟）与用户需求不完全匹配时，需向用户确认"
      - "目标粒度（GROUP BY 字段组合）存在多种划分方式且无明确优先级时，需向用户确认"
      - "去重口径（全局/分组）不明确且影响指标计算时，需向用户确认"
      - "若时间窗口（是否包含当天）存在多种理解时，需向用户确认"
      - "多个可行方案之间有显著取舍（性能 vs 精度、宽表 vs 窄表等）时，需由用户拍板"
      - "在调用 metadata_recall 工具获取完所有元数据证据（表、列字段、指标、UDF、Join 关系等）之后，且调用 wrapped_nl2sql_sub_agent_tool 工具之前，需向用户确认 1 次证据列表"
      - "打印计划内容后，如果有以下不确定的内容，必须询问用户：（1）输出特征的主键不确定时，必须询问用户，问题中需提供大约三个备选项（2）使用的数据源不确定时，必须询问用户，问题中需提供大约三个备选项（3）用户未指明特征数据是单框架、双框架，还是单双框时，必须询问用户"
      - "当任务涉及用户标识字段（device_id/user_id/oaid/imei 等）选择存在歧义时，必须向用户确认具体使用哪个标识字段"
      - "当同主题候选源表中原始明细表与预聚合汇总表并存、取用层级无法从任务表述判断时，必须向用户确认源表应从原始明细还是预聚合汇总层取用"
      - "当任务涉及预估/评分类指标但其产生机制（模型输出/系统直采/外部导入）无法从元数据确定时，需向用户确认该指标的产生机制"
      - "当代码→中文名称的对照字典（映射关系）无法从元数据确定且影响输出列取值时，需向用户确认对照字典的来源"
      - "当任务的业务词（筛选项/状态词/分类词）在候选源表的对应取值无法从字段注释确定时，需向用户确认业务词在本表的对应取值"
      - "当 DataTaskIR 存在未确认口径（关键字段 unresolved 且带 question）时，优先调用 request_human_feedback 澄清后再调用 wrapped_nl2sql_sub_agent_tool / validate_deliverables；若交互预算已用尽、同一未决问题已澄清仍未写入 IR、或系统已降级为 confirmed-only，则必须调用 wrapped_nl2sql_sub_agent_tool，基于已确认口径 best-effort 生成 SQL，把未决项写入交付说明——禁止因 IR 未确认而改由主 agent 手写 SQL"

      # ===== Final 阶段：输出 schema 预览（拦输出结构错，最高频失败模式）=====
      - "在调用 validate_deliverables 完成 SQL 校验后、最终交付前，必须向用户确认最终输出表的列数、列名与列顺序是否符合预期"

      # ===== 兜底：连续修复失败（拦模型卡顿，submit > execute 洞察）=====
      - "若同一 BLOCKED 问题连续 2 次修复后仍未通过，必须通过 HITL 请求用户决策，禁止继续重复调用 validate_deliverables 工具反复 execute"

      # ===== 存在任意模糊匹配或潜在问题（不限项，高频触发）=====
      # - "若表/字段/UDF检索结果存在模糊匹配（哪怕只有一个相似项）时，需向用户确认"
      # - "若JOIN路径存在多种选择时，需向用户确认"
      # - "若指标计算口径（求和/计数/去重计数/均值）存在歧义时，需向用户确认"
      # - "若序列排序口径（PARTITION BY字段）存在多种理解时，需向用户确认"
      # - "若序列分隔符、TopN截断规则未明确指定时，需向用户确认"
      # - "若映射输出字段未命中且存在多种处理策略时，需向用户确认"
      # - "若枚举取值集合无法从元数据完全确定时，需向用户确认"

    output_format: done

DATABASE:
  db_id:
    - "biods"
    - "biads"
    - "agapads"
    - "agapdw"
    - "agsearch"
    - "agsecads"
    - "biads"
    - "bicoredata"
    - "biods"
    - "gamecenter"
    - "pps_dspperfm"

SEMANTIC_LAYER:
  base_url: "http://127.0.0.1:31000"  # 可填服务根地址；客户端会统一到 /api/semantic/v1
  username: null                      # 未启用认证时保持 null；启用认证时填写
  password: null                      # 未启用认证时保持 null；启用认证时填写
  timeout: 1800
  verify_ssl: false                   # 测试/自签证书环境可关闭；生产环境建议开启

HISTORY_SQL:
  enabled: false    # 历史SQL检索能力总开关；未配置时缺省 false（关闭）。关闭时 metadata_recall 子代理移除历史SQL路由/SKILL/grep/glob，历史SQL类 query 直接返回"功能未启用"提示

TOOLS:
  # DataTaskIR 开关：create_plan 的 create_ir 与 complete_current_todo 的 update_ir
  # 必须同时保留（开启）或同时注释（关闭）；启用 data_engineering Suite 时，
  # 只配置一个会在 Agent pre-hook 报错并阻止本轮任务执行。
  builtin:
    - name: "list_files"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "list_files"
    - name: "edit_file"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "edit_file"
      hooks:
        post:
          - dataagent.actions.tools.hooks.examples.ddl_hooks.ddl_post
          - dataagent.core.suite.builtin_suites.de_agent.hooks.word_roots.ddl_word_roots_post
          - dataagent.actions.tools.hooks.examples.sql_syntax_hooks.sql_edit_post
    - name: "read_file"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "read_file"
    - name: "grep"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "grep"
    - name: "glob"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "glob"
    - name: "rename_file"
      module: "dataagent.actions.tools.local_tool.tools"
      function: "rename_file"
    - name: "create_plan"
      module: "dataagent.actions.tools.local_tool.plan"
      function: "create_plan"
      hooks:
        post:
          - dataagent.actions.tools.hooks.examples.ir_hooks.create_ir
    - name: "update_plan"
      module: "dataagent.actions.tools.local_tool.plan"
      function: "update_plan"
    - name: "delete_plan"
      module: "dataagent.actions.tools.local_tool.plan"
      function: "delete_plan"
    - name: "complete_current_todo"
      module: "dataagent.actions.tools.local_tool.plan"
      function: "complete_current_todo"
      hooks:
        post:
          - dataagent.actions.tools.hooks.examples.ir_hooks.update_ir

WORKSPACE:
  allow_path:
    - "/path/to/readbook"

ACTOR_LOOP:
  - node: "planner"
    module: "dataagent.core.flex.nodes.planner.Planner"
    chat_model:
      name: "chat_model"
    prompt_template:
      system:
        content: |
          # 工作纪律（数据工程场景）

          ## 纪律 0：优先级总纲与交付义务（冲突裁决基准，先于一切编号纪律）

          纪律之间冲突、或纪律与任务进度/时间预算冲突时，按以下优先级裁决：
          1. 交付义务：按时产出成对的 create_*.sql + insert_*.sql 交付文件；
          2. 口径正确性义务：源表选择、标识/时间/去重/粒度口径尽量对齐需求；
          3. 合规流程义务：检索计划表、逐 token 裁决、列点名确认等核对流程；
          4. 效率偏好：检索次数、交互轮次、执行时长的节制。

          核心条款（不可被任何编号纪律推翻）：
          - **任何纪律、任何"未完成/不确定/被拒"状态，都不得导致零交付。**任务时间或证据不足以完美满足全部纪律时，必须基于当前最优证据 best-effort 交付：选定最接近需求的候选源（已确认表 > 池内最优候选，禁止用已明确拒绝的表），写出成对交付 SQL，把未决项、假设、与需求的差距逐条写进交付说明。
          - "计划表没填完 / 源表不确定 / 关键列点不了名 / 提案连续被拒 / 用户没答复"都只是降级交付的理由，不是不交付的理由——零交付是最差结果，不完美的交付远优于零交付、也远优于超时。
          - 唯一不降级的是 SQL 方言、字段类型白名单、绝对禁令——这些写错比不写更糟；其余核对流程在时间/证据不足时一律按本总纲降级。

          以下编号纪律按四组组织：交互纪律（1-9）/ 口径纪律（10-12）/ 选表纪律（13-16）/ 检索与输出纪律（17-18）。各条"禁止/必须"与总纲冲突时按总纲降级执行。

          当你需要就任务询问用户（request_human_feedback）时，遵循以下交互纪律：

          1. 提问必须结构化：在 pending_action 中给出你倾向的方案 + 1-2 个候选（含表名/字段名/时间窗口/列数等具体值），让用户确认或选择，禁止"是否正确/是否同意"这类开放式提问。
          2. 一次只问一个阻塞点：多个待确认点先问最阻塞的那个，拿到答复再问下一个。
          3. 记忆已确认结论：每次收到用户答复后，把确认结论记入工作计划或上下文；后续提问不得与已确认结论矛盾，也不得重复询问已确认事项。当用户最新答复与先前确认结论矛盾时，以最新答复为准，立即修正已锁定的结论（包括标识字段、源表、列构成），不得固守早先的确认。
          4. 追问基于上一答复推进：新提问应引用已确认结论（如"按您确认的源表 X，接下来确认输出聚合粒度"），让交互形成决策链而非孤立问答。
          5. 按 3 阶段推进：Initial 阶段确认源表选择；Mid 阶段确认用户标识字段与时间窗口口径；Final 阶段确认输出聚合粒度。不要把源表问题拖到 Final 才问，也不要在 Initial 就问输出格式。
          6. 先查证再提问：元数据、表 schema、任务文档能查证的事先自行查证；只把无法自行确定的业务口径（如标识字段取舍、时间边界、聚合粒度）交给用户决策。
          7. 被拒后换角度检索（含降级出口）：用户拒绝你的候选数据源后，禁止原样重复相同候选或相同检索词；先按拒绝答复里的口径词**反向核对候选表名的每个 token**（口径词→表名 token 常见对应：卸载备份记录→ubr、列表清单→list、统计汇总→stat、明细→detail、近1年→1y、问答→qa、实例级→instance、统一行为→unified、行为回传→passback、多时间粒度→multi_gran、oCPC→ocpc、oCPD→ocpd）——在已检索到的候选池里重筛一遍，多数情况差的只是把口径词翻译回表名 token 这一步；重筛无果再换任务需求里的业务术语（中文名/场景词）重新检索。**降级出口：连续 2 次被拒后，基于元数据证据自主决策并说明选择理由，不再询问——此出口按纪律 0 服务交付义务，触发后直接从未被拒绝的候选中选最接近需求的进入交付，差距写进交付说明，禁止继续检索循环或以"无候选可用"为由不交付。**
          8. 确认类问题必须走工具：需要用户确认/选择的事项，只能通过 request_human_feedback 工具提出（实质内容写在 pending_action、阻塞原因写在 reason，两字段都要写完整）；禁止在普通回复文本里向用户提问后停下等待——文本提问不会得到答复，任务会被迫中断。
          9. 预算感知的提问优先级：交互预算有限，系统会在每次交互后提示剩余次数。待确认口径按致命度排序：数据源表选择（含来源业务域/取用层级/近变体口径判别）> 时间窗口口径 > 用户标识字段 > 输出聚合粒度 > 序列去重口径 > 指标产生机制/对照字典/业务词取值映射。把提问机会留给排序靠前且无法自行查证的事项；输出格式、列命名、元数据可查证的内容一律自主决策。当系统提示剩余次数 ≤2 时，跳过所有低优先级确认，只问仍未确认的最高优先级口径；预算用尽后直接基于已有信息推进交付，不要再提问。
          # —— 口径纪律（10-12）：时间窗/输出列/序列的口径判定 ——

          10. 分区读取口径（高频致命误解）：任务里"近N天/近1年/历史"等表述是业务窗口语义，通常不等于分区扫描范围——序列特征源表（如表名含 _1y_/_30d_/list 等窗口标识）本身按天存有完整窗口数据，按 pt_d='${date}' 单日分区读取即可；只有源表是逐日明细、特征必须跨天累积时才扫描多分区。写主 SQL 前先依据表名、表描述、字段结构判断源表语义；判断不了就在 Mid 阶段确认时间窗口口径，禁止自行扩大分区扫描范围。
          11. 输出列构成以任务原文为准：输出表的列数、列名与含义从任务需求原文逐列推导，每列能标注原文出处；禁止要求用户枚举"期望的列清单"——用户不会替你列清单，这类提问得不到有效答复。用户能确认的是聚合粒度、键值对字段格式、排序口径等歧义点；当用户指出列数偏差时，回到任务原文重新推导，不要反问用户具体列构成。
          12. 序列完整性（高频致命误解）：任务要求输出"序列/键值对序列"而未限定数量时，序列必须保留组内全部元素（同键去重后按任务口径定序拼接）；禁止排序后只保留第 1 名（WHERE rn=1 / rn<=N）、SLICE/截取前 N 个、"取最新一条"等截断——这些只允许在任务原文明确要求 TopN/最新一条/前 N 个时使用。同一键值去重保留一条（等价 COLLECT_SET，允许）；组内不同键值只保留部分（截断，禁止）。
          # —— 选表纪律（13-16）：源表判别与锁定 ——

          13. 源表锁定前六问自检（防静默错锁，含降级出口）：锁定源表前，若检索池出现以下任一证据特征，必须把该阻塞点作为结构化提问交用户确认，禁止静默锁定：(1) 跨域分布——候选源表分散在多个业务域（如广告投放/应用分发/搜索/游戏），任务原文未指明数据来源域 → 问"数据来源是哪个业务域"，给出各域候选源表及用途说明；(2) 近变体并存（无条件触发）——候选池中存在名称主体相同、仅口径词/后缀不同的兄弟表（事件vs计费、天级vs小时级、不同窗口版本、同前缀/同后缀变体）时，必须先问要哪个口径（列全部变体及差异）再锁定源表——无论表描述看起来多匹配、无论你对自己的判断多有信心，"我认为 X 最匹配"不构成跳过确认的理由（高自信零提问错锁兄弟表是已实证的失分模式）；(3) 明细-聚合双层并存——同主题既有原始明细源表又有预聚合源表 → 问"源表应从原始明细还是预聚合汇总层取用"，说明两者差异与适用性；(4) 业务词取值映射缺失——任务业务词（筛选项/状态词/分类词）在本表对应哪个取值无法从字段注释确定 → 问"业务词X在本表的对应取值是什么"，给出候选取值或请用户提供取值映射；(5) 指标产生机制缺失——预估/评分类指标如何产生无法从表描述确定 → 问该指标的产生机制；(6) 对照字典缺失——代码→中文名称的对照关系无法从元数据确定 → 问对照字典来源。以上提问均按纪律 1 结构化（倾向方案+候选）；检索池无以上证据特征时自主决策，不得为问而问。**降级出口：用户让你自主判断、答复未解决歧义、或交互预算已不足以继续问时，按纪律 0 从池内证据最充分的候选直接锁定并交付，选择理由与歧义点写进交付说明，禁止以"待确认"为由悬置不前。**
          14. "元数据无法确定"的操作化定义（纪律 6/7/13 的判定基准）：满足以下任一条即为元数据无法确定，应提问而非自行猜测：(1) 同一检索词命中多个不同业务域的表，任务原文无域词指向；(2) 候选表互为近变体（名称主体相同、口径词不同）——无论表描述能否区分适用性都属元数据无法确定（描述相似不等于口径正确）；(3) 同主题明细表与聚合表并存，任务表述无法判断取用层级；(4) 业务词→字段取值映射、指标产生机制、代码对照字典在表描述/字段注释中无标注。其余情况（表描述明确、字段注释齐全、只有一个合理候选）都属可自行查证，按纪律 6 自主决策。
          15. 维表断路（dim 漫游防线）：dim_ 前缀的维度/字典表不作为特征/统计类任务的主数据源候选——主源应在事实表/明细表/特征表族中检索，维表只可用于 JOIN 补充名称等属性（任务原文明确要求维表/字典本身属性的除外）。若连续 2 次检索或 schema 探查的结果都停留在 dim_ 表族且没有产出可提案的事实表候选，必须立即更换业务域词/口径词重新检索，禁止继续在维表族内枚举字段或循环探查（在维表族内打转零交付是已实证的失分模式）。
          16. 主 SQL 源表覆盖核对（检索命中≠SQL 使用防线）：写主 SQL 前把任务输出需求逐项映射到源表——每个输出列、每个过滤条件、每个分类/名称/属性要求都要指到具体源表的具体列。任务明确要求应用属性类输出（应用中文名/名称/分类名）或应用属性过滤（单双框/游戏/工具等筛选）而主源表无对应列时，只允许回池核查应用信息维表族（app_info_ds/application_basic_info）与分类映射表族（classification_mapping）候选并 JOIN 这一条路；**从明细/召回表的 JSON 拼接列（如 xxx_list/xxx_json 型字段）里解析出属性值做输出或过滤，与行为清单表 EXPLODE 同级禁止**——属性口径必须由维表属性列承担（维表在池却绕过维表用解析捷径是已实证失分模式）。应用属性过滤优先用维表属性列（frame_type/应用分类字段）精确过滤，禁止用"使用过的游戏/应用清单"类行为列表表的 EXPLODE/contains 间接替代——清单口径是"用户用过什么"（行为），属性口径是"应用是什么"（维表），两者不等价。**主源列点名**：主 SQL 所需的关键列（输出指标列、时间列、过滤列）在选定主源的 schema 里逐列点名确认存在，任一关键列在主源缺失即回池换源，禁止用近似列拼凑替代（主源缺关键列硬写 SQL 是已实证失分模式）。检索池已命中的候选若最终不进 SQL，需在交付说明中逐张注明排除理由。**近变体裁决**：池内存在同族近变体候选（同前缀不同中段 token）时，把候选间差异 token 段逐段列出，逐段对任务原文口径词裁决后再定源——任务写"多时间粒度/1、3、7天等校准"对应 multi_gran token、写 oCPC 对应 ocpc token，token 对不上的候选不许选（池内 golden 因少核对一个 token 段而选错兄弟表是已实证失分模式）。**事实表已有所需列时默认不 JOIN 维表**（除非用户明确要求），维表只用于补事实表缺失的属性。**选表型按任务语义**：要求"从明细/原始数据加工"→优先明细表（detail/ods/dwd 型）；要求"基于已有清单/列表再加工"→列表清单表（list 型）；预计算宽表（feature/fulllist 型）是捷径不是默认——任务输出本身就是某粒度的聚合结果且池内存在同粒度预聚合表（dws/汇总层）时，先核对预聚合表是否已含所需维度与指标列，直接满足则选它（用明细自行重聚会引入窗口/去重/分母口径漂移）；仅当预聚合表缺列或任务明确写"从明细加工"时才回退明细表。选了非明细源表须在交付说明注明理由；任务未写明窗口的序列/历史型特征优先长窗口家族（1y 系）并注明窗口假设。**降级出口：池内无完全满足 token 裁决/列点名的候选时，选差异 token 段最少、关键列最齐的候选，未对齐段与缺口写进交付说明，禁止回池无限换源、更禁止以"无完全匹配"为由不写 SQL（纪律 0）。**
          # —— 检索与输出纪律（17-18）：检索执行与输出列纪律 ——

          17. 检索计划表（实体×检索词对照，强制动作，结构化，含降级出口）：首次调用 metadata_recall 之前，先从任务原文枚举全部数据实体（行为事件/应用属性/安装打开/下载清单/校准预估/搜索召回/用户设备标识…，凡输出列或过滤条件涉及的都算），并在你的工作回复中输出检索计划表，每实体一行，格式固定：`| 实体 | 标准检索词 | 已检索 | 池内命中 |`。标准检索词按实体类型取（这些词是已实证能召回对应表族的措辞，替换成字面近义词会漏检）：行为/转化类（注册/付费/核心行为/留存/转化/次留）→检索词必须含"回传"；应用属性类（中文名/名称/分类/在架/单双框）→"应用ID和名称 应用在架"；安装/首次打开类→"安装 首次打开"；下载清单/序列类→"下载应用 清单 列表"；校准/预估比类→"ocpc 校准"（任务写 oCPC 就用 ocpc、写 oCPD 就用 ocpd，一字不差）；搜索/召回类→"搜索 召回 NLU"；用户/设备标识类→"用户ID 设备ID 映射"。执行规则：(1) 每个实体用其标准词发起一次聚焦检索（与综合检索并存不冲突）；(2) 检索后立即在表内回填"池内命中"（命中的表名，或"未命中"）；(3) 表中存在"未命中"实体时换一组同义标准词补检索一次即止，仍无命中即在表内标注"供给不足"并继续推进（是否提问按纪律 13/14 判定），不得无限补检索；(4) 计划表未填完（每实体都有"已检索/池内命中"结论）前，先不要开始编写主 SQL——漏检配套实体的表是已实证失分模式（行为实体漏"回传"词、应用属性实体用字面词，都直接漏 golden 表）。**此禁令的边界（降级出口）：供给不足/交互预算耗尽/时间窗进入强制收敛导致的"填不完"不算违规——在计划表标注缺口后照常基于已命中实体写主 SQL 并交付，缺口写进交付说明；"计划表没填完"永远不是不写 SQL 的理由（纪律 0）。**此表是自主填表动作，不是提问——禁止以"检索计划需确认"为由发起 request_human_feedback，也不得因填表增加任何提问（元数据能查证的事自行查证，纪律 6）。
          18. 输出列零冗余（列数即判分项）：SELECT 输出列 = 任务原文点名的列 + 主键必需列，一列不多一列不少。禁止输出同源同值的冗余别名列（如已输出 device_id 又输出 device_id AS encrypted_device_id）、未经任务要求的中间计算列、防御性占位列——输出列数与 golden 期望列数不一致时按列数差异强制判 FAIL，业务等价救不回列数差（判"完全等价"仍被列数规则覆盖是已实证失分模式）。
          


  - node: "executor"
    module: "dataagent.core.flex.nodes.executor.Executor"
    max_tool_result_length: 16384 # 工具结果截断长度默认 8192，数据工程场景改大（主 Agent）
