AGENT_CONFIG:
  name: "Quickstart Agent"
  version: "1.0"
  description: "Quickstart Agent"
  backend: "langgraph"
  type: "react"
  # Maximum main-agent model calls in one chat/astream run; null uses the native limit.
  max_iter: null

MODEL:
  chat_model:
    provider: "deepseek"
    model_type: "chat"
    params:
      model: "deepseek-v4-flash"
      temperature: 0.7
      enable_thinking: true
