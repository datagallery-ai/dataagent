site_name: DataAgent Docs
docs_dir: .
site_dir: ../site

exclude_docs: |
  mkdocs部署说明.md

validation:
  omitted_files: ignore

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: DataAgent 文档
          theme:
            language: zh
            palette:
              - scheme: default
                toggle:
                  name: 切换到深色模式
              - scheme: slate
                toggle:
                  name: 切换到浅色模式
          nav:
            - 简介: index.md
            - 上手:
                - 安装部署: installation/installation.md
                - 快速开始: quick_start/quick_start.md
                - 数据库安装: installation_doc/database_install/database_install.md
                - 数据库镜像拉取: installation_doc/database_install/image-pull.md
                - 数据库服务部署: installation_doc/database_install/service-deployment.md
                - 场景数据导入: installation_doc/database_install/scenario-data-import.md
                - Semantic Service 部署: installation_doc/database_install/semantic-service-deployment.md
                - Semantic Service 使用: semantic_service/semantic-service-user-guide.md
                - 开发环境: explain/explain.md
            - 功能: function/function.md
            - 案例:
                - 概览: case/case.md
                - 构建数据分析 Agent: case/build-a-dataagent-from-scratch.md
                - 构建 NL2SQL 专用 Agent: case/build-an-nl2sql-application.md
            - 接口:
                - 概览: api_doc/api_doc.md
                - A2A 北向服务: api_doc/A2A_Northbound_Service_Interface.md
                - Python SDK: api_doc/PythonSDK.md
            - 架构:
                - 概览: design_doc/design_doc.md
                - Context 模块: design_doc/Context_Module_Design.md
                - 规划引擎: design_doc/Planning_Engine_Module_Design.md
                - Action 管理: design_doc/Action_Management_Module_Design.md
                - openJiuwen 后端: openJiuwen/openJiuwen-user-guide.md
            - 开发:
                - 里程碑: milestone/milestone.md
        - locale: en
          name: English
          build: true
          site_name: DataAgent Docs
          theme:
            language: en
          nav:
            - Introduction: index.md
            - Get started:
                - Installation: installation/installation.md
                - Quick Start: quick_start/quick_start.md
                - Database Installation: installation_doc/database_install/database_install.md
                - Pull Docker Images: installation_doc/database_install/image-pull.md
                - Deploy Database Services: installation_doc/database_install/service-deployment.md
                - Import Scenario Data: installation_doc/database_install/scenario-data-import.md
                - Semantic Service Deployment: installation_doc/database_install/semantic-service-deployment.md
                - Semantic Service Usage: semantic_service/semantic-service-user-guide.md
                - Development Environment: explain/explain.md
            - Features: function/function.md
            - Cases:
                - Overview: case/case.md
                - Build a Data Analysis Agent: case/build-a-dataagent-from-scratch.md
                - Build a Dedicated NL2SQL Agent: case/build-an-nl2sql-application.md
            - API:
                - Overview: api_doc/api_doc.md
                - A2A Northbound Service: api_doc/A2A_Northbound_Service_Interface.md
                - Python SDK: api_doc/PythonSDK.md
            - Architecture:
                - Overview: design_doc/design_doc.md
                - Context Module: design_doc/Context_Module_Design.md
                - Planning Engine: design_doc/Planning_Engine_Module_Design.md
                - Action Management: design_doc/Action_Management_Module_Design.md
                - openJiuwen Backend: openJiuwen/openJiuwen-user-guide.md
            - Develop:
                - Milestone: milestone/milestone.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - static/stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - static/javascripts/mermaid-init.js
  - static/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
