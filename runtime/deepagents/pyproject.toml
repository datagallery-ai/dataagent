[project]
name = "deepagents-runtime"
version = "0.1.0"
description = "DataFoundry Deep Agents extensions (tools, middleware, backends)"
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
