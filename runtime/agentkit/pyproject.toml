[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dataagent"
version = "0.1.0"
description = "Local DataAgent product built on native Deep Agents and AG-UI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.7.12",
  "langchain==1.3.18",
  "langchain-core==1.6.1",
  "langsmith[otel]==0.12.5",
  "langchain-openai==1.6.0",
  "langchain-mcp-adapters==0.3.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "aiosqlite>=0.22,<1",
  "anyio>=4,<5",
  "ag-ui-langgraph==0.0.44",
  "ag-ui-protocol==0.1.22",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "wcmatch>=11,<12",
]

[project.scripts]
dataagent = "restapi.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["dataagent", "restapi"]

[tool.hatch.build.targets.wheel.force-include]
"builtin-plugins" = "dataagent/builtin-plugins"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: requires explicitly configured real model credentials"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
