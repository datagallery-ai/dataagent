AGENT_CONFIG:
  name: "agent_b"
  type: "react"
  backend: "langgraph"

MODEL:
  deepseek:
    model_type: "chat"
    provider: "bailian"
    params:
      model: "deepseek-v3.2"
      temperature: 0.7
  # Default ACTOR_LOOP keeps nl2sql_react → chat_model; provide provider for merge.
  chat_model:
    model_type: "chat"
    provider: "bailian"
    params:
      model: "deepseek-v3.2"
      temperature: 0.7

SCENARIO:
  chat:
    input: a query to process
    task: use slow_tool_agent_b to process the query
    instructions: ONLY call slow_tool_agent_b. Do NOT use any other tool.
    output_format: the tool result data

PRE_WORKFLOW: []

ACTOR_LOOP:
  - node: "planner"
    module: "dataagent.core.flex.nodes.planner.Planner"
    chat_model:
      name: "deepseek"

  - node: "executor"
    module: "dataagent.core.flex.nodes.executor.Executor"

TOOLS:
  local_functions:
    - module: "tests.st.concurrency.slow_tools"
      function: "slow_tool_agent_b"

# 测试夹具：无证书材料，显式关闭出站 mTLS，避免默认 mode 3 缺文件失败。
# CI 无 framework_om，校验路径必须显式关闭 encrypted，避免 from_config 调内部包。
certificate:
  outbound_enabled: false
  inbound_enabled: false
  inbound_encrypted: false
  outbound_encrypted: false

