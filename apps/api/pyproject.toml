[project]
name = "datafoundry-api"
version = "0.3.0"
description = "DataFoundry Python control plane and DataAgent runtime"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "DataFoundry" },
]
dependencies = [
    "ag-ui-langgraph>=0.0.22",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=44.0.0",
    "datagallery-dataagent[nl2sql]",
    "fastapi>=0.115.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.uv.sources]
datagallery-dataagent = { path = "../../runtime/dataagent", editable = true }

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafoundry_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"
