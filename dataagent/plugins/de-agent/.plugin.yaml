schema_version: 3
id: de-agent
requires:
- nl2sql
defaults_file: config.yaml
system_prompt_file: prompts/agent.md
skills:
- skills
subagents:
- subagents/metadata-recall.yaml
- subagents/history-sql-recall.yaml
tools:
  get_table_schema:
    entrypoint: tools/metadata.py:get_table_schema
    scope: subagents
  get_join_relations:
    entrypoint: tools/metadata.py:get_join_relations
    scope: subagents
  search_udf_function_by_name_keyword:
    entrypoint: tools/metadata.py:search_udf_function_by_name_keyword
    scope: subagents
  search_udf_function_by_dsl:
    entrypoint: tools/metadata.py:search_udf_function_by_dsl
    scope: subagents
  validate_table_name:
    entrypoint: tools/metadata.py:validate_table_name
  check_table_existence:
    entrypoint: tools/metadata.py:check_table_existence
  query_sql_process:
    entrypoint: tools/metadata.py:query_sql_process
  rename_file:
    entrypoint: tools/files.py:rename_file
  validate_word_roots:
    entrypoint: tools/word_roots.py:validate_word_roots
  read_ir:
    entrypoint: tools/ir.py:read_ir
  dataops_probe_table:
    entrypoint: tools/dataops.py:dataops_probe_table
  trial_compute_table:
    entrypoint: tools/dataops.py:trial_compute_table
  dataops_validate_data:
    entrypoint: tools/dataops.py:dataops_validate_data
  check_and_repair_sql:
    entrypoint: tools/sql_checkers.py:check_and_repair_sql
hooks:
  after_tool:
  - entrypoint: hooks/word_roots.py:check_word_roots
    matcher: write_file
  - entrypoint: hooks/word_roots.py:check_word_roots
    matcher: edit_file
  - entrypoint: hooks/files.py:check_ddl
    matcher: write_file
  - entrypoint: hooks/files.py:check_ddl
    matcher: edit_file
  - entrypoint: hooks/files.py:check_insert_syntax
    matcher: write_file
  - entrypoint: hooks/files.py:check_insert_syntax
    matcher: edit_file
  - entrypoint: hooks/ir.py:update_ir
    matcher: write_todos
  - entrypoint: hooks/ir.py:record_ir_diagnostics
    matcher: task
  - entrypoint: hooks/ir.py:record_ir_diagnostics
    matcher: de-agent__check_and_repair_sql
  - entrypoint: hooks/ir.py:record_ir_diagnostics
    matcher: de-agent__read_ir
  before_tool:
  - entrypoint: hooks/history_sql.py:prepare_search
    matcher: task
  - entrypoint: hooks/metadata.py:prepare_recall
    matcher: task
  - entrypoint: hooks/files.py:guard_insert
    matcher: write_file
  - entrypoint: hooks/ir.py:ensure_ir_ready
    matcher: task
  - entrypoint: hooks/ir.py:ensure_ir_ready
    matcher: de-agent__read_ir
  - entrypoint: hooks/ir.py:ensure_ir_ready
    matcher: de-agent__check_and_repair_sql
  before_agent:
  - entrypoint: hooks/ir.py:prepare_turn
  after_model:
  - entrypoint: hooks/delivery.py:require_pair
  before_model:
  - entrypoint: hooks/delivery.py:deadline
  - entrypoint: hooks/ir.py:prepare_context
hitl:
  enabled: true
  instructions: prompts/hitl.md
  policies:
  - id: text_question_guard
    version: '1'
    at: after_model
    handler: hitl/completion_guards.py:TextQuestionGuard
    params:
      text_question_max_fires: 2
  - id: ir_question_guard
    version: '1'
    at: after_model
    handler: hitl/ir_question_guard.py:IRQuestionGuard
    params:
      budget: 8
      hitl_question_guard_max_fires: 2
      hitl_max_same_fingerprint_asks: 2
      hitl_max_same_field_asks: 2
      hitl_blocking_fields:
      - identity
      - sources
      - time_context
      - output_features
      consumerTools:
      - de-agent__check_and_repair_sql
  - id: ir_caliber_review
    version: '1'
    at: after_model
    handler: hitl/caliber_review.py:CaliberReview
  - id: human_feedback_guard
    version: '1'
    at: after_model
    handler: hitl/completion_guards.py:HumanFeedbackGuard
    params:
      conditions: []
params:
  word_roots:
    english_name_column: 词根英文名
    abbreviation_column: 词根简称
    chinese_name_column: 词根中文名
    description_column: 描述
    type_column: 词根类型
    regex_column: 特殊词根规则
    special_type_value: 特殊词根
    llm_model: primary
  data_task_ir:
    enabled: false
    model: primary
    refresh_policy: eager
    max_concurrency: 8
    completion_batch_size: 1
    concise_rationale: false
    compact_json: false
    field_order: template
    semantic_field_reuse: false
    semantic_check_policy: warn
    enable_ir_caliber_review: false
  delivery:
    require_sql_pair: false
    task_wall_budget_seconds: 0
    max_model_calls: 0
    forcing_window_seconds: 60
    iteration_window: 2
  dataops:
    enabled: true
    model: primary
    timeout_s: 3600
    poll_interval_ms: 30000
    drop_before_create: true
    auto_trial_compute: true
    quality_check:
      enabled: true
      checks:
      - null_rate
      - single_value_ratio
      - outlier_ratio
      - row_count
      sample_size: 10000
      thresholds:
        null_rate_threshold: 0.8
        single_value_threshold: 0.95
        outlier_ratio_threshold: 0.0
        row_count_threshold: 1
      ratio_field_patterns:
      - ratio
    enable_thinking: false
  sql_checkers:
    model: primary
    max_model_calls: 6
    repair_attempts: 2
    timeout_seconds: 600
    disabled_rules: []
    dataops_validation_enabled: true
    enable_thinking: false
  history_sql:
    enabled: false
    corpus_path: null
