plugins:
  config:
    de-agent:
      allowed_databases: []
      model: primary
    nl2sql:
      model: primary
      database:
        dialect: hive
      nodes:
      - perceptor
      - generator
      - validator
      - reflector
      generator:
        strategies:
        - prompt
      validator:
        read_only: false
        db_explain: false
        sql_security_enabled: false
      run_hooks:
        before_run:
        - entrypoint: hooks/nl2sql.py:prepare_input
        after_run:
        - entrypoint: hooks/nl2sql.py:finish_output
