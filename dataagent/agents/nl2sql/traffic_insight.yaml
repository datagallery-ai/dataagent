AGENT_CONFIG:
  name: "NL2SQL Traffic Insight Agent"
  backend: "langgraph"
  type: "nl2sql"
MODEL:
  chat_model:
    model_type: "chat"
    provider: "bailian"
    params:
      model: "qwen3-30b-a3b"
      temperature: 0.0
CORE:
  perceptor:
    user_sql_rules: "sql_rules_traffic_insight"
  generator:
    strategies: ["prompt"]
  validator:
    db_explain: false
    keyword_match: false
    metadata_match: false
  reflector:
    threshold: 0.9
DATABASE:
  db_id: "yunhe"
  dialect: "postgres"
  engine: "cloud_core"
  perceptor_type: "traffic_insight"
  config:
    path: ""
    explain_url: "https://"  # 出站走 outbound_tls（httpx_verify("cloud_core")）；填完整 https 地址
SEMANTIC_LAYER:
  base_url: "http://"  # 可填服务根地址；客户端会统一到 /api/semantic/v1
  username: null
  password: null
  timeout: 30
  traffic_insight:
    recall:
      column_eq_page_size: 200
      column_eq_max_offset: 100000
      max_candidate_tables: 200
      hybrid_batch_size: 50
      max_llm_table_families: 20
      exclude_table_prefix: ["dim"]

# certificate: 整段不写 / 空段 = 默认 inbound+outbound 开启且 mode 3，必须补证书路径；
#   要关请显式 inbound_enabled: false / outbound_enabled: false。

